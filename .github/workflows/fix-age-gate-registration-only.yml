name: Fix Age Gate Registration Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-age-gate-registration-only.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move age gate into registration flow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('mobile/App.tsx')
          s = app.read_text()

          s = s.replace("import AgeGate, { AGE_GATE_KEY } from './AgeGate';", "import AgeGate from './AgeGate';", 1)

          marker = "  const [termsAccepted, setTermsAccepted] = useState(false);"
          assert marker in s
          s = s.replace(marker, marker + "\n  const [ageVerified, setAgeVerified] = useState(false);", 1)

          marker = "      if (!termsAccepted) throw new Error('يجب الموافقة على الشروط والأحكام وسياسة الخصوصية أولاً.');"
          assert s.count(marker) >= 2
          s = s.replace(marker, "      if (!ageVerified) throw new Error('يجب التحقق من العمر قبل إنشاء الحساب.');\n" + marker, 2)

          old = "  const changeMode = (next: 'user' | 'register' | 'admin') => {\n    setMode(next);\n    setOtpSent(false);\n    setOtp('');\n  };"
          new = "  const changeMode = (next: 'user' | 'register' | 'admin') => {\n    setMode(next);\n    setOtpSent(false);\n    setOtp('');\n    setAgeVerified(false);\n  };"
          assert old in s
          s = s.replace(old, new, 1)

          marker = "  const help = mode === 'admin'\n    ? 'دخول المدير للتحكم الكامل بالحسابات والإعلانات والإعدادات.'\n    : mode === 'register'\n      ? 'سجّل برقم جوالك، وسنؤكد الرقم برمز OTP يُرسل إلى واتساب.'\n      : 'سجّل الدخول لإضافة إعلان ومتابعة إعلاناتك.';"
          assert marker in s
          s = s.replace(marker, marker + "\n\n  if (mode === 'register' && !ageVerified) {\n    return <AgeGate onAllowed={() => setAgeVerified(true)} onBack={() => changeMode('user')} />;\n  }", 1)

          s = s.replace("  const [ageAllowed, setAgeAllowed] = useState<boolean | null>(null);\n", "", 1)

          old_effect = "  useEffect(() => {\n    SecureStore.getItemAsync(AGE_GATE_KEY).then((value) => setAgeAllowed(value === 'yes')).catch(() => setAgeAllowed(false));\n  }, []);\n\n"
          assert old_effect in s
          s = s.replace(old_effect, "", 1)

          old_gate = "  if (ageAllowed === null) return <View style={styles.center}><ActivityIndicator size=\"large\" color={PURPLE} /><Text style={styles.stateText}>جاري التحقق...</Text></View>;\n  if (!ageAllowed) return <AgeGate onAllowed={() => setAgeAllowed(true)} />;\n\n"
          assert old_gate in s
          s = s.replace(old_gate, "", 1)

          app.write_text(s)

          age = Path('mobile/AgeGate.tsx')
          a = age.read_text()
          a = a.replace("import * as SecureStore from 'expo-secure-store';\n", "")
          a = a.replace("export const AGE_GATE_KEY='used_age_18_confirmed_v1';\n\n", "")
          a = a.replace("export default function AgeGate({ onAllowed }:{ onAllowed:()=>void }) {", "export default function AgeGate({ onAllowed, onBack }:{ onAllowed:()=>void; onBack?:()=>void }) {")
          a = a.replace("    await SecureStore.setItemAsync(AGE_GATE_KEY,'yes');\n    onAllowed();", "    onAllowed();")
          old = "      <Pressable style={s.button} onPress={submit}><Text style={s.buttonText}>متابعة</Text></Pressable>\n      <Text style={s.note}>لا تعرض الشاشة عمرًا افتراضيًا ولا تقترح إجابة، ويجب إدخال تاريخ الميلاد يدويًا.</Text>"
          new = "      <Pressable style={s.button} onPress={submit}><Text style={s.buttonText}>متابعة التسجيل</Text></Pressable>\n      {onBack ? <Pressable style={s.backButton} onPress={onBack}><Text style={s.backText}>العودة لتسجيل الدخول</Text></Pressable> : null}\n      <Text style={s.note}>يُستخدم تاريخ الميلاد للتحقق من العمر فقط ولا يتم حفظه.</Text>"
          assert old in a
          a = a.replace(old, new, 1)
          a = a.replace("buttonText:{color:'#fff',fontSize:16,fontWeight:'900'},note:", "buttonText:{color:'#fff',fontSize:16,fontWeight:'900'},backButton:{paddingVertical:13,paddingHorizontal:18},backText:{color:P,fontSize:13,fontWeight:'900'},note:", 1)
          age.write_text(a)
          PY

      - name: TypeScript check
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx mobile/AgeGate.tsx
          git commit -m "fix: show age gate only for new registration"
          git push origin main
