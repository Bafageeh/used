name: Fix Used Home Layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-used-home-layout.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Fix collapsed browsing rows and oversized cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          reps = {
            '<ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.storyRow}>': '<ScrollView horizontal style={styles.storyScroller} showsHorizontalScrollIndicator={false} contentContainerStyle={styles.storyRow}>',
            '<ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.categoryTabs}>': '<ScrollView horizontal style={styles.categoryScroller} showsHorizontalScrollIndicator={false} contentContainerStyle={styles.categoryTabs}>',
            '<ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.filterRow}>': '<ScrollView horizontal style={styles.filterScroller} showsHorizontalScrollIndicator={false} contentContainerStyle={styles.filterRow}>',
            '{uri ? <Image source={{ uri }} style={styles.cardImage} resizeMode="cover" />': '{uri ? <Image source={{ uri }} style={[styles.cardImage, compact && styles.cardImageGrid]} resizeMode="cover" />',
            "  storyRow: { backgroundColor: '#fff', paddingHorizontal: 10, paddingTop: 14, paddingBottom: 9, gap: 13 },": "  storyScroller: { height: 101, backgroundColor: '#fff' },\n  storyRow: { minHeight: 101, backgroundColor: '#fff', paddingHorizontal: 10, paddingTop: 12, paddingBottom: 9, gap: 13, alignItems: 'flex-start' },",
            "  categoryTabs: { backgroundColor: '#fff', paddingHorizontal: 10, borderBottomWidth: 1, borderBottomColor: '#EEEAF2', minHeight: 49, alignItems: 'flex-end', gap: 4 },": "  categoryScroller: { height: 50, backgroundColor: '#fff' },\n  categoryTabs: { height: 50, backgroundColor: '#fff', paddingHorizontal: 10, borderBottomWidth: 1, borderBottomColor: '#EEEAF2', alignItems: 'flex-end', gap: 4 },",
            "  filterRow: { paddingHorizontal: 12, paddingVertical: 12, gap: 8, alignItems: 'center' },": "  filterScroller: { height: 67, backgroundColor: SURFACE },\n  filterRow: { height: 67, paddingHorizontal: 12, paddingVertical: 12, gap: 8, alignItems: 'center' },",
            "  card: { marginHorizontal: 12, marginBottom: 10, minHeight: 154, backgroundColor: '#fff', borderRadius: 18, borderWidth: 1, borderColor: BORDER, flexDirection: 'row', overflow: 'hidden', shadowColor: '#1D102D', shadowOpacity: 0.05, shadowRadius: 8, shadowOffset: { width: 0, height: 2 }, elevation: 2 },": "  card: { marginHorizontal: 12, marginBottom: 10, height: 158, backgroundColor: '#fff', borderRadius: 18, borderWidth: 1, borderColor: BORDER, flexDirection: 'row', overflow: 'hidden', shadowColor: '#1D102D', shadowOpacity: 0.05, shadowRadius: 8, shadowOffset: { width: 0, height: 2 }, elevation: 2 },",
            "  cardGrid: { width: '47.8%', marginHorizontal: 0, minHeight: 290, flexDirection: 'column' },": "  cardGrid: { width: '47.8%', marginHorizontal: 0, height: 288, flexDirection: 'column' },",
            "  cardImageWrap: { width: '42%', minHeight: 154, backgroundColor: '#EEEAF2', position: 'relative' },": "  cardImageWrap: { width: '42%', height: 158, backgroundColor: '#EEEAF2', position: 'relative', overflow: 'hidden' },",
            "  cardImage: { width: '100%', height: '100%' },": "  cardImage: { width: '100%', height: 158 },\n  cardImageGrid: { height: 142 },",
            "  cardBody: { flex: 1, minHeight: 154, paddingHorizontal: 13, paddingVertical: 11, alignItems: 'flex-end' },": "  cardBody: { flex: 1, height: 158, paddingHorizontal: 13, paddingVertical: 11, alignItems: 'flex-end', justifyContent: 'space-between' },",
          }
          missing=[]
          for old,new in reps.items():
            if old not in s:
              missing.append(old[:90])
            else:
              s=s.replace(old,new,1)
          if missing:
            raise SystemExit('Missing replacement anchors:\n'+'\n'.join(missing))
          p.write_text(s)
          PY
      - name: Validate active app
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install
          npx tsc --noEmit
          npx expo install --check
          npx expo export --platform android --output-dir /tmp/used-home-layout-dist
      - name: Commit layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Used home browsing rows and card sizing'
            git push origin main
          fi
      - name: Start Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run start-expo.yml --ref main
