name: Verify Admin Account

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-admin-account.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_verify_key
          chmod 600 ~/.ssh/used_verify_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify production admin row and routes
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_verify_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          set -eu
          cd '${{ secrets.DEPLOY_PATH }}/api'
          php artisan tinker --execute='$u=App\Models\User::where("username","admin")->first(); if(!$u){throw new Exception("ADMIN_MISSING");} echo "ADMIN_USERNAME=".$u->username.PHP_EOL; echo "ADMIN_ROLE=".$u->role.PHP_EOL; echo "ADMIN_ACTIVE=".($u->is_active?"YES":"NO").PHP_EOL; echo "ADMIN_PASSWORD_HASH=".($u->password?"PRESENT":"MISSING").PHP_EOL;'
          php artisan route:list --path=auth/admin-login | grep -q 'auth/admin-login'
          php artisan route:list --path=admin/users | grep -q 'admin/users'
          php artisan route:list --path=admin/settings | grep -q 'admin/settings'
          echo ADMIN_SYSTEM=READY
          REMOTE
