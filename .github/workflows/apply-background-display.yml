name: Apply Background Removal Display

on:
  push:
    paths:
      - '.github/workflows/apply-background-display.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Patch mobile processed-image display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()

          old = "type ListingImage = { id: number; url?: string; path?: string };"
          new = "type ListingImage = { id: number; url?: string; path?: string; original_url?: string; processed_url?: string | null; processing_status?: string };"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('ListingImage type anchor not found')

          old = '''{uri ? <Image source={{ uri }} style={[styles.cardImage, compact && styles.cardImageGrid]} resizeMode="cover" /> : ('''
          new = '''{uri ? <Image source={{ uri }} style={[styles.cardImage, compact && styles.cardImageGrid]} resizeMode={item.images?.[0]?.processed_url ? 'contain' : 'cover'} /> : ('''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Listing card image anchor not found')

          old = '''{photos.map((photo) => <Image key={photo.id} source={{ uri: imageUrl(photo) }} style={styles.detailImage} resizeMode="cover" />)}'''
          new = '''{photos.map((photo) => <Image key={photo.id} source={{ uri: imageUrl(photo) }} style={styles.detailImage} resizeMode={photo.processed_url ? 'contain' : 'cover'} />)}'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Detail image anchor not found')

          s = s.replace("cardImageWrap: { width: '42%', height: 158, backgroundColor: '#EEEAF2'", "cardImageWrap: { width: '42%', height: 158, backgroundColor: '#FAFAFA'", 1)
          s = s.replace("gallery: { width: '100%', backgroundColor: '#EDE8F3' }", "gallery: { width: '100%', backgroundColor: '#FAFAFA' }", 1)
          s = s.replace("detailImage: { width: 390, height: 310, backgroundColor: '#EDE8F3' }", "detailImage: { width: 390, height: 310, backgroundColor: '#FAFAFA' }", 1)

          marker = '''        <View style={styles.mediaActionRow}>\n          <Pressable style={styles.mediaActionButton} onPress={chooseImages}'''
          note = '''        <Text style={{ color: MUTED, fontSize: 11, textAlign: 'right', marginTop: 5 }}>تُزال خلفية الصور تلقائيًا مع الاحتفاظ بالصورة الأصلية.</Text>\n'''
          first = s.find(marker)
          if first != -1 and note not in s:
              preview = '''        <ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.previewRow}>'''
              pos = s.find(preview, first)
              if pos != -1:
                  s = s[:pos] + note + s[pos:]

          old_published = "const published = () => { setEditListing(null); setRefreshKey((x) => x + 1); setScreen('home'); };"
          new_published = "const published = () => { setEditListing(null); setRefreshKey((x) => x + 1); setScreen('home'); setTimeout(() => setRefreshKey((x) => x + 1), 4000); setTimeout(() => setRefreshKey((x) => x + 1), 10000); };"
          if old_published in s:
              s = s.replace(old_published, new_published, 1)
          elif new_published not in s:
              raise SystemExit('Published refresh anchor not found')

          p.write_text(s)
          PY

      - name: Validate mobile
        run: |
          cd mobile
          npm install --no-audit --no-fund
          npx tsc --noEmit
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Commit mobile changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx
          git commit -m 'Refresh listings after background processing' || exit 0
          git push origin main

      - name: Restart Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/start-expo.yml/dispatches \
            -d '{"ref":"main"}'
