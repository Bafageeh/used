name: Apply Home UI Layout Change

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-home-ui-change.yml"

permissions:
  contents: write

jobs:
  patch-home-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested home UI changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('mobile/App.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old_header = '''        <IconButton name="grid-outline" onPress={() => setMenuOpen(true)} />'''
          new_header = '''        <IconButton name={viewMode === 'list' ? 'grid-outline' : 'list-outline'} onPress={() => setViewMode((x) => x === 'list' ? 'grid' : 'list')} />'''
          assert old_header in text, 'Top-left grid/menu icon snippet not found'
          text = text.replace(old_header, new_header, 1)

          start_marker = '''  const categoryTabs = (\n'''
          end_marker = '''  const toolbar = (\n'''
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          assert start != -1 and end != -1 and end > start, 'categoryTabs block not found'
          text = text[:start] + text[end:]

          old_view_toggle = '''        <Pressable style={styles.viewToggle} onPress={() => setViewMode((x) => x === 'list' ? 'grid' : 'list')}>\n          <Ionicons name={viewMode === 'list' ? 'grid-outline' : 'list-outline'} size={23} color={PURPLE} />\n        </Pressable>\n'''
          assert old_view_toggle in text, 'Lower view toggle snippet not found'
          text = text.replace(old_view_toggle, '', 1)

          assert '      {categoryTabs}\n' in text, 'categoryTabs render call not found'
          text = text.replace('      {categoryTabs}\n', '', 1)

          assert text != original, 'No changes were applied'
          assert 'const categoryTabs =' not in text, 'categoryTabs definition still present'
          assert '{categoryTabs}' not in text, 'categoryTabs render still present'
          assert 'style={styles.viewToggle}' not in text, 'Old lower view toggle still present'
          assert new_header in text, 'New top-left view toggle missing'

          path.write_text(text, encoding='utf-8')
          print('Home UI patch applied successfully.')
          PY

      - name: Verify requested UI structure
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('mobile/App.tsx').read_text(encoding='utf-8')
          checks = {
              'secondary category strip removed': 'const categoryTabs =' not in text and '{categoryTabs}' not in text,
              'lower view toggle removed': 'style={styles.viewToggle}' not in text,
              'top-left icon toggles view': "<IconButton name={viewMode === 'list' ? 'grid-outline' : 'list-outline'} onPress={() => setViewMode((x) => x === 'list' ? 'grid' : 'list')} />" in text,
              'upper circular category row retained': 'const storyRow = (' in text,
          }
          for label, ok in checks.items():
              print(('OK' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: simplify home categories and move view toggle"
          git push origin HEAD:main
