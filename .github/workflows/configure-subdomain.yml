name: Configure used.pm.sa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-subdomain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Create subdomain
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_PORT SERVER_USER SERVER_SSH_KEY DEPLOY_PATH; do
            test -n "${!name:-}" || { echo "::error::Missing production secret: $name"; exit 1; }
          done

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Create cPanel subdomain and request SSL
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          DOMAIN="used.pm.sa"
          CPANEL_USER="pmsa"
          DOCUMENT_ROOT="${DEPLOY_PATH}/public"

          install -d -m 755 "$DOCUMENT_ROOT"

          if uapi --user="$CPANEL_USER" Domains list_domains --output=json |
             tr -d '\n' | grep -Fq "\"$DOMAIN\""; then
            echo "$DOMAIN already exists."
          else
            result="$(uapi --user="$CPANEL_USER" Domains add_domain \
              domain="$DOMAIN" \
              document_root="$DOCUMENT_ROOT" \
              --output=json)"
            printf '%s\n' "$result"
            printf '%s' "$result" | grep -Eq '"status"[[:space:]]*:[[:space:]]*1' || {
              echo "Failed to create $DOMAIN." >&2
              exit 1
            }
          fi

          if command -v whmapi1 >/dev/null 2>&1; then
            whmapi1 start_autossl_check_for_one_user username="$CPANEL_USER" || true
          fi

          echo "Subdomain configured: https://$DOMAIN"
          echo "Document root: $DOCUMENT_ROOT"
          REMOTE
