name: Detail Owner Management

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-detail-owner-management.yml'
      - 'scripts/patch_detail_owner_management.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Patch detail owner management
        run: python3 scripts/patch_detail_owner_management.py

      - name: Install and validate
        working-directory: mobile
        run: |
          npm install
          npx expo install expo-secure-store
          npx tsc --noEmit
          npx expo install --check
          rm -rf /tmp/used-detail-owner-bundle
          npx expo export --platform android --output-dir /tmp/used-detail-owner-bundle

      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'No app changes to commit.'
          else
            git commit -m 'Move listing management into details and persist session'
          fi
          git pull --rebase --autostash origin main
          git push origin main

      - name: Restart Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/start-expo.yml/dispatches \
            -d '{"ref":"main"}'
