name: Used Expo Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expo-diagnostics.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_diag_key
          chmod 600 ~/.ssh/used_diag_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Read current Expo diagnostics
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_diag_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          ROOT='${{ secrets.DEPLOY_PATH }}'
          MOBILE_PATH="$ROOT/mobile"
          cd "$MOBILE_PATH" || exit 1
          echo '--- LARAVEL ROOT ---'
          if [ -f "$ROOT/artisan" ]; then echo "Laravel root: $ROOT"; else echo 'artisan missing at root'; fi
          if [ -f "$ROOT/api/artisan" ]; then echo "Laravel api dir: $ROOT/api"; fi
          echo '--- LISTING IMAGE PAYLOAD ---'
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://used.pm.sa/api/listings', headers={'Accept':'application/json','User-Agent':'used-diagnostics'})
          with urllib.request.urlopen(req, timeout=20) as r: data=json.load(r)
          for item in (data.get('data') or [])[:10]:
              images=item.get('images') or []
              print(json.dumps({'id':item.get('id'),'title':item.get('title'),'images_count':len(images),'images':[{'id':i.get('id'),'path':i.get('path'),'url':i.get('url')} for i in images[:8]]}, ensure_ascii=False))
          PY
          for API_PATH in "$ROOT" "$ROOT/api"; do
            [ -f "$API_PATH/artisan" ] || continue
            echo "--- STORAGE AT $API_PATH ---"
            if [ -d "$API_PATH/storage/app/public/listings" ]; then
              find "$API_PATH/storage/app/public/listings" -type f -printf '%P | %s bytes\n' | sort | head -n 120
            else
              echo 'No listings storage directory'
            fi
            echo 'PUBLIC STORAGE:'
            ls -ld "$API_PATH/public/storage" 2>/dev/null || echo 'public/storage missing'
          done
          echo '--- EXPO STATUS ---'
          curl -sSI http://127.0.0.1:8091 2>/dev/null | head -n 4 || true
          npm ls expo react react-native --depth=0 || true
          REMOTE
