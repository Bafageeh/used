name: Used Expo Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expo-diagnostics.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_diag_key
          chmod 600 ~/.ssh/used_diag_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Read current Expo diagnostics
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_diag_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          ROOT='${{ secrets.DEPLOY_PATH }}'
          MOBILE_PATH="$ROOT/mobile"
          API_PATH="$ROOT/api"
          cd "$MOBILE_PATH" || exit 1
          echo '--- LOCATION ---'
          pwd
          echo '--- PROCESS ---'
          ps -ef | grep -E '[e]xpo|[c]loudflared|8091' | tail -n 30 || true
          echo '--- PORT ---'
          curl -sSI http://127.0.0.1:8091 2>/dev/null | head -n 10 || true
          echo '--- LISTING IMAGE PAYLOAD ---'
          python3 - <<'PY'
          import json, urllib.request
          url='https://used.pm.sa/api/listings'
          req=urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'used-diagnostics'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=json.load(r)
          for item in (data.get('data') or [])[:10]:
              images=item.get('images') or []
              print(json.dumps({
                  'id': item.get('id'),
                  'title': item.get('title'),
                  'images_count': len(images),
                  'images': [{'id': i.get('id'), 'path': i.get('path'), 'url': i.get('url')} for i in images[:8]],
              }, ensure_ascii=False))
          PY
          echo '--- IMAGE FILES ON SERVER ---'
          if [ -d "$API_PATH/storage/app/public/listings" ]; then
            find "$API_PATH/storage/app/public/listings" -type f -printf '%P | %s bytes\n' | sort | head -n 120
          else
            echo 'No listings storage directory'
          fi
          echo '--- PUBLIC STORAGE LINK ---'
          ls -ld "$API_PATH/public/storage" 2>/dev/null || true
          echo '--- PACKAGE VERSIONS ---'
          npm ls expo react react-native --depth=0 || true
          echo '--- ERRORS ---'
          if [ -f expo.log ]; then
            sed -r 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' expo.log | grep -Ei 'error|exception|fatal|invariant|typeerror|referenceerror|addViewAt|fabric|crash|failed|warning' | tail -n 160 || true
            echo '--- LAST LOG ---'
            sed -r 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' expo.log | tail -n 220 || true
          else
            echo 'expo.log missing'
          fi
          REMOTE
