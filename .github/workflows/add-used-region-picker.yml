name: Add Used Region Picker

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-used-region-picker.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Patch region picker
        run: python3 .github/scripts/add_used_regions.py

      - name: Validate active app
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install
          npx tsc --noEmit
          npx expo install --check
          npx expo export --platform android --output-dir /tmp/used-regions-dist

      - name: Commit region picker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Add searchable multi-region marketplace filter'
            git push origin main
          fi

      - name: Start Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run start-expo.yml --ref main
