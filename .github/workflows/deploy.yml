name: Deploy Used Marketplace

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: used-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_deploy_key
          chmod 600 ~/.ssh/used_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Prepare Laravel and upload code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            mkdir -p '$DEPLOY_PATH'
            if [ ! -f '$DEPLOY_PATH/artisan' ]; then
              BOOTSTRAP_DIR=\$(mktemp -d /tmp/used-laravel.XXXXXX)
              composer create-project laravel/laravel \"\$BOOTSTRAP_DIR\" --no-interaction --prefer-dist
              cd \"\$BOOTSTRAP_DIR\"
              php artisan install:api --no-interaction
              tar -czf /tmp/used-laravel-bootstrap.tgz .
              tar -C '$DEPLOY_PATH' -xzf /tmp/used-laravel-bootstrap.tgz
              rm -rf \"\$BOOTSTRAP_DIR\" /tmp/used-laravel-bootstrap.tgz
            fi
            test -f '$DEPLOY_PATH/artisan'"
          tar -C backend -czf /tmp/used-backend.tgz .
          scp -i ~/.ssh/used_deploy_key -P "$SERVER_PORT" /tmp/used-backend.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-backend.tgz"
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            tar -C '$DEPLOY_PATH' -xzf /tmp/used-backend.tgz
            rm -f /tmp/used-backend.tgz
            test -f '$DEPLOY_PATH/artisan'"

      - name: Configure database and migrate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            cd '$DEPLOY_PATH'
            current_app_key=\$(sed -n 's/^APP_KEY=\(base64:[A-Za-z0-9+\/=]*\)\r\?$/\1/p' .env 2>/dev/null | head -n 1 || true)

            mkdir -p database storage/app/database-backups
            touch database/database.sqlite
            chmod 664 database/database.sqlite

            if [ -s database/database.sqlite ]; then
              backup_name=storage/app/database-backups/database-\$(date +%Y%m%d-%H%M%S).sqlite
              cp database/database.sqlite \"\$backup_name\"
            fi
            find storage/app/database-backups -type f -name 'database-*.sqlite' -mtime +14 -delete

            clean_env=\$(mktemp .env.deploy.XXXXXX)
            chmod 600 \"\$clean_env\"
            {
              printf '%s\n' 'APP_NAME=UsedMarketplace'
              printf '%s\n' 'APP_ENV=production'
              printf '%s\n' 'APP_DEBUG=false'
              printf '%s\n' 'APP_URL=https://used.pm.sa'
              printf '%s\n' 'LOG_CHANNEL=stack'
              printf '%s\n' 'LOG_LEVEL=error'
              printf '%s\n' 'DB_CONNECTION=sqlite'
              printf '%s\n' 'CACHE_STORE=file'
              printf '%s\n' 'SESSION_DRIVER=file'
              printf '%s\n' 'QUEUE_CONNECTION=sync'
            } > \"\$clean_env\"

            if [ -n \"\$current_app_key\" ]; then
              printf 'APP_KEY=%s\n' \"\$current_app_key\" >> \"\$clean_env\"
            fi
            mv -f \"\$clean_env\" .env

            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            find storage bootstrap/cache database -type d -exec chmod 775 {} \;
            find storage bootstrap/cache database -type f -exec chmod 664 {} \;
            php artisan optimize:clear
            if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
            php artisan migrate --force
            php artisan storage:link || test -L public/storage
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            find storage bootstrap/cache database -type d -exec chmod 775 {} \;
            find storage bootstrap/cache database -type f -exec chmod 664 {} \;
            chmod 600 .env
            php artisan optimize
            php artisan about --only=environment
            php artisan migrate:status"

      - name: Verify API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if ! curl --silent --show-error --fail --retry 5 --retry-delay 5 https://used.pm.sa/api/health; then
            echo "API health check failed. Showing Laravel and web-server diagnostics."
            ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH'
              php artisan about --only=environment || true
              tail -n 120 storage/logs/laravel.log 2>/dev/null || true
              tail -n 80 ~/logs/used.pm.sa.php.error.log 2>/dev/null || true
              tail -n 80 ~/logs/error_log 2>/dev/null || true"
            exit 1
          fi
