name: Deploy Used Marketplace

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: used-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_deploy_key
          chmod 600 ~/.ssh/used_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Prepare Laravel and upload code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            mkdir -p '$DEPLOY_PATH'
            if [ ! -f '$DEPLOY_PATH/artisan' ]; then
              BOOTSTRAP_DIR=\$(mktemp -d /tmp/used-laravel.XXXXXX)
              composer create-project laravel/laravel \"\$BOOTSTRAP_DIR\" --no-interaction --prefer-dist
              cd \"\$BOOTSTRAP_DIR\"
              php artisan install:api --no-interaction
              tar -czf /tmp/used-laravel-bootstrap.tgz .
              tar -C '$DEPLOY_PATH' -xzf /tmp/used-laravel-bootstrap.tgz
              rm -rf \"\$BOOTSTRAP_DIR\" /tmp/used-laravel-bootstrap.tgz
            fi
            test -f '$DEPLOY_PATH/artisan'"
          tar -C backend -czf /tmp/used-backend.tgz .
          scp -i ~/.ssh/used_deploy_key -P "$SERVER_PORT" /tmp/used-backend.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-backend.tgz"
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            tar -C '$DEPLOY_PATH' -xzf /tmp/used-backend.tgz
            rm -f /tmp/used-backend.tgz
            test -f '$DEPLOY_PATH/artisan'"

      - name: Configure and migrate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          encode_env_value() { jq -Rn --arg value "$1" '$value' | base64 -w 0; }
          DB_HOST_B64="$(encode_env_value "$DB_HOST")"
          DB_PORT_B64="$(encode_env_value "$DB_PORT")"
          DB_DATABASE_B64="$(encode_env_value "$DB_DATABASE")"
          DB_USERNAME_B64="$(encode_env_value "$DB_USERNAME")"
          DB_PASSWORD_B64="$(encode_env_value "$DB_PASSWORD")"

          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            cd '$DEPLOY_PATH'
            current_app_key=\$(sed -n 's/^APP_KEY=\(base64:[A-Za-z0-9+\/=]*\)\r\?$/\1/p' .env 2>/dev/null | head -n 1 || true)
            clean_env=\$(mktemp .env.deploy.XXXXXX)
            chmod 600 \"\$clean_env\"

            write_env() {
              key=\"\$1\"
              encoded=\"\$2\"
              value=\$(printf '%s' \"\$encoded\" | base64 -d)
              printf '%s=%s\\n' \"\$key\" \"\$value\" >> \"\$clean_env\"
            }

            write_env APP_NAME VXNlZE1hcmtldHBsYWNl
            write_env APP_ENV cHJvZHVjdGlvbg==
            write_env APP_DEBUG ZmFsc2U=
            write_env APP_URL aHR0cHM6Ly91c2VkLnBtLnNh
            write_env LOG_CHANNEL c3RhY2s=
            write_env LOG_LEVEL ZXJyb3I=
            write_env DB_CONNECTION bXlzcWw=
            write_env DB_HOST '$DB_HOST_B64'
            write_env DB_PORT '$DB_PORT_B64'
            write_env DB_DATABASE '$DB_DATABASE_B64'
            write_env DB_USERNAME '$DB_USERNAME_B64'
            write_env DB_PASSWORD '$DB_PASSWORD_B64'

            if [ -n \"\$current_app_key\" ]; then
              printf 'APP_KEY=%s\\n' \"\$current_app_key\" >> \"\$clean_env\"
            fi
            mv -f \"\$clean_env\" .env

            php artisan optimize:clear
            if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
            php artisan about --only=environment
            php artisan migrate --force
            php artisan storage:link || test -L public/storage
            php artisan optimize"

      - name: Verify API
        run: curl --fail --retry 5 --retry-delay 5 https://used.pm.sa/api/health
