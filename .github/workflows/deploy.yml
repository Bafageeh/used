name: Deploy Used Marketplace

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: used-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_deploy_key
          chmod 600 ~/.ssh/used_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Prepare Laravel and upload code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            mkdir -p '$DEPLOY_PATH'
            if [ ! -f '$DEPLOY_PATH/artisan' ]; then
              BOOTSTRAP_DIR=\$(mktemp -d /tmp/used-laravel.XXXXXX)
              composer create-project laravel/laravel \"\$BOOTSTRAP_DIR\" --no-interaction --prefer-dist
              cd \"\$BOOTSTRAP_DIR\"
              php artisan install:api --no-interaction
              tar -czf /tmp/used-laravel-bootstrap.tgz .
              tar -C '$DEPLOY_PATH' -xzf /tmp/used-laravel-bootstrap.tgz
              rm -rf \"\$BOOTSTRAP_DIR\" /tmp/used-laravel-bootstrap.tgz
            fi
            test -f '$DEPLOY_PATH/artisan'"
          tar -C backend -czf /tmp/used-backend.tgz .
          scp -i ~/.ssh/used_deploy_key -P "$SERVER_PORT" /tmp/used-backend.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-backend.tgz"
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            tar -C '$DEPLOY_PATH' -xzf /tmp/used-backend.tgz
            rm -f /tmp/used-backend.tgz
            printf '%s' '' | base64 -d > '$DEPLOY_PATH/index.php'
            printf '%s' 'PElmTW9kdWxlIG1vZF9yZXdyaXRlLmM+CiAgICBSZXdyaXRlRW5naW5lIE9uCiAgICBSZXdyaXRlQ29uZCAle1JFUVVFU1RfRklMRU5BTUV9ICEtZAogICAgUmV3cml0ZUNvbmQgJXtSRVFVRVNUX0ZJTEVOQU1FfSAhLWYKICAgIFJld3JpdGVSdWxlIF4gaW5kZXgucGhwIFtMXQo8L0lmTW9kdWxlPgo=' | base64 -d > '$DEPLOY_PATH/.htaccess'
            chmod 644 '$DEPLOY_PATH/index.php' '$DEPLOY_PATH/.htaccess'
            test -f '$DEPLOY_PATH/artisan'
            test -f '$DEPLOY_PATH/index.php'"


      - name: Publish domain document root
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          domain_json=$(ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "uapi --output=json DomainInfo single_domain_data domain=used.pm.sa")
          domain_root=$(printf '%s' "$domain_json" | jq -r '.result.data.documentroot // empty')
          if [ -z "$domain_root" ] || [ "$domain_root" = "/" ]; then
            echo "Unable to resolve the cPanel document root for used.pm.sa"
            printf '%s\n' "$domain_json"
            exit 1
          fi
          echo "Resolved used.pm.sa document root: $domain_root"
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            test -f '$DEPLOY_PATH/public/index.php'
            mkdir -p '$domain_root'
            printf '%s' '' | base64 -d > '$domain_root/index.php'
            sed -i 's|__USED_APP_PUBLIC_INDEX__|$DEPLOY_PATH/public/index.php|' '$domain_root/index.php'
            printf '%s' 'PElmTW9kdWxlIG1vZF9yZXdyaXRlLmM+CiAgICBSZXdyaXRlRW5naW5lIE9uCiAgICBSZXdyaXRlQ29uZCAle1JFUVVFU1RfRklMRU5BTUV9ICEtZAogICAgUmV3cml0ZUNvbmQgJXtSRVFVRVNUX0ZJTEVOQU1FfSAhLWYKICAgIFJld3JpdGVSdWxlIF4gaW5kZXgucGhwIFtMXQo8L0lmTW9kdWxlPgo=' | base64 -d > '$domain_root/.htaccess'
            chmod 644 '$domain_root/index.php' '$domain_root/.htaccess'
            test -s '$domain_root/index.php'"

      - name: Configure database and migrate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            cd '$DEPLOY_PATH'
            current_app_key=\$(sed -n 's/^APP_KEY=\(base64:[A-Za-z0-9+\/=]*\)\r\?$/\1/p' .env 2>/dev/null | head -n 1 || true)

            mkdir -p database storage/app/database-backups
            touch database/database.sqlite
            chmod 664 database/database.sqlite

            if [ -s database/database.sqlite ]; then
              backup_name=storage/app/database-backups/database-\$(date +%Y%m%d-%H%M%S).sqlite
              cp database/database.sqlite \"\$backup_name\"
            fi
            find storage/app/database-backups -type f -name 'database-*.sqlite' -mtime +14 -delete

            clean_env=\$(mktemp .env.deploy.XXXXXX)
            chmod 600 \"\$clean_env\"
            {
              printf '%s\n' 'APP_NAME=UsedMarketplace'
              printf '%s\n' 'APP_ENV=production'
              printf '%s\n' 'APP_DEBUG=false'
              printf '%s\n' 'APP_URL=https://used.pm.sa'
              printf '%s\n' 'LOG_CHANNEL=stack'
              printf '%s\n' 'LOG_LEVEL=error'
              printf '%s\n' 'DB_CONNECTION=sqlite'
              printf '%s\n' 'CACHE_STORE=file'
              printf '%s\n' 'SESSION_DRIVER=file'
              printf '%s\n' 'QUEUE_CONNECTION=sync'
            } > \"\$clean_env\"

            if [ -n \"\$current_app_key\" ]; then
              printf 'APP_KEY=%s\n' \"\$current_app_key\" >> \"\$clean_env\"
            fi
            mv -f \"\$clean_env\" .env

            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            find storage bootstrap/cache database -type d -exec chmod 775 {} \;
            find storage bootstrap/cache database -type f -exec chmod 664 {} \;
            php artisan optimize:clear
            if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
            php artisan migrate --force
            php artisan storage:link || test -L public/storage
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            find storage bootstrap/cache database -type d -exec chmod 775 {} \;
            find storage bootstrap/cache database -type f -exec chmod 664 {} \;
            chmod 600 .env
            php artisan optimize
            php artisan about --only=environment
            php artisan migrate:status
            if [ -s storage/logs/laravel.log ]; then
              mv storage/logs/laravel.log storage/logs/laravel-before-verify-\$(date +%Y%m%d-%H%M%S).log
            fi
            touch storage/logs/laravel.log
            chmod 664 storage/logs/laravel.log"

      - name: Verify API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          response_file=$(mktemp)
          probe_file=$(mktemp)
          probe_status=$(curl --silent --show-error --output "$probe_file" --write-out '%{http_code}' 'https://used.pm.sa/index.php?deploy_runtime_probe=used-runtime-v3' || true)
          echo "Web PHP probe through index.php: HTTP $probe_status"
          cat "$probe_file" || true
          echo
          if [ "$probe_status" != "200" ]; then
            echo "The domain PHP handler failed before Laravel started."
          fi
          status_code=$(curl --silent --show-error --location --retry 5 --retry-delay 5 --output "$response_file" --write-out '%{http_code}' https://used.pm.sa/api/health || true)
          if [ "$status_code" != "200" ]; then
            echo "API health check failed with HTTP $status_code."
            echo "Response body (first 40 lines):"
            sed -n '1,40p' "$response_file" || true
            ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH'
              echo 'Laravel environment:'
              php artisan about --only=environment || true
              echo 'Route check:'
              php artisan route:list --path=api/health || true
              echo 'Latest cPanel/PHP log files:'
              find ~/logs ~/access-logs '$DEPLOY_PATH' -maxdepth 3 -type f \\( -name '*error*' -o -name '*.log' \\) -mmin -15 -print 2>/dev/null | head -n 30 || true
              echo 'CURRENT LARAVEL ERRORS (this verification only):'
              if [ -s storage/logs/laravel.log ]; then
                sed -n '1,80p' storage/logs/laravel.log || true
              else
                echo 'No current Laravel errors'
              fi
              echo 'CURRENT WEB SERVER ERRORS:'
              find ~/logs ~/access-logs '$DEPLOY_PATH' -maxdepth 3 -type f \\( -name '*error*' -o -name 'error_log' \\) -mmin -10 -exec tail -n 12 {} \\; 2>/dev/null || true
              echo 'PHP MODULES:'
              php -m | grep -E 'PDO|sqlite|mbstring|openssl' || true
              echo 'END OF DIAGNOSTICS' "
            exit 1
          fi
          cat "$response_file"
