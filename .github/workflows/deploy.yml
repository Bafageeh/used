name: Deploy Used API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: used-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_api_key
          chmod 600 ~/.ssh/used_api_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload API to active Laravel app
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tar --exclude=vendor --exclude=.env -C api -czf /tmp/used-api.tgz .
          scp -i ~/.ssh/used_api_key -P "$SERVER_PORT" /tmp/used-api.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-api.tgz"
          ssh -i ~/.ssh/used_api_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          set -eu
          API_PATH='${{ secrets.DEPLOY_PATH }}/api'
          cd "$API_PATH"
          test -f artisan
          test -f .env
          tar -xzf /tmp/used-api.tgz
          rm -f /tmp/used-api.tgz

          export COMPOSER_ALLOW_SUPERUSER=1
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

          mkdir -p storage/app/public/listings storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R ug+rwX storage bootstrap/cache

          php artisan optimize:clear
          php artisan migrate --force
          php artisan storage:link || test -L public/storage

          # Backward compatibility: old accounts used the password column for the numeric PIN.
          php artisan tinker --execute="Illuminate\\Support\\Facades\\DB::table('users')->whereNull('pin')->whereNotNull('password')->update(['pin' => Illuminate\\Support\\Facades\\DB::raw('password')]);"

          # Keep the local background-removal + tight-crop service alive across API deployments.
          VENV="$API_PATH/storage/rembg-venv"
          if [ -x "$VENV/bin/python" ] && [ -f "$API_PATH/bin/rembg_service.py" ]; then
            "$VENV/bin/pip" install -q fastapi uvicorn python-multipart pillow
            if [ -f storage/rembg.pid ]; then
              oldpid=$(cat storage/rembg.pid 2>/dev/null || true)
              [ -z "${oldpid:-}" ] || kill "$oldpid" 2>/dev/null || true
            fi
            pkill -f 'rembg s.*127.0.0.1.*8092' 2>/dev/null || true
            pkill -f 'uvicorn rembg_service:app.*8092' 2>/dev/null || true
            sleep 1
            mkdir -p storage/rembg-models storage/logs
            nohup env U2NET_HOME="$API_PATH/storage/rembg-models" OMP_NUM_THREADS=2 \
              "$VENV/bin/python" -m uvicorn rembg_service:app --app-dir "$API_PATH/bin" --host 127.0.0.1 --port 8092 \
              > "$API_PATH/storage/logs/rembg.log" 2>&1 < /dev/null &
            echo $! > storage/rembg.pid

            READY=0
            for i in $(seq 1 30); do
              sleep 2
              if curl -fsS --max-time 3 http://127.0.0.1:8092/api >/dev/null 2>&1; then
                READY=1
                break
              fi
            done
            if [ "$READY" = 1 ]; then
              echo 'REMBG_TIGHT_CROP=READY'
            else
              echo 'REMBG_TIGHT_CROP=FAILED'
              tail -n 120 storage/logs/rembg.log || true
              exit 5
            fi
          else
            echo 'REMBG_TIGHT_CROP=NOT_INSTALLED'
          fi

          # Reprocess existing listing images once so current listings also lose empty transparent margins.
          if [ -x "$VENV/bin/python" ] && [ ! -f storage/.tight-crop-v1-done ]; then
            php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $disk = Illuminate\Support\Facades\Storage::disk('public');
          $done = 0;
          $failed = 0;

          foreach (App\Models\ListingImage::query()->whereNotNull('path')->cursor() as $image) {
              try {
                  $source = $disk->path($image->path);
                  if (!is_file($source)) {
                      $failed++;
                      continue;
                  }

                  $response = Illuminate\Support\Facades\Http::connectTimeout(3)
                      ->timeout(180)
                      ->attach('file', file_get_contents($source), basename($source))
                      ->post('http://127.0.0.1:8092/api/remove');

                  if (!$response->successful() || strlen($response->body()) < 100) {
                      $failed++;
                      continue;
                  }

                  $processed = $image->processed_path
                      ?: 'listings/'.$image->listing_id.'/processed/'.Illuminate\Support\Str::uuid().'.png';
                  $disk->put($processed, $response->body());
                  $image->forceFill([
                      'processed_path' => $processed,
                      'processing_status' => 'done',
                      'processed_at' => now(),
                  ])->save();
                  $done++;
              } catch (Throwable $e) {
                  $failed++;
              }
          }

          echo "TIGHT_CROP_EXISTING_DONE={$done} FAILED={$failed}\n";
          PHP
            touch storage/.tight-crop-v1-done
          fi

          php artisan config:cache
          php artisan view:cache

          echo '--- ACTIVE AUTH CONTROLLER ---'
          grep -n "'pin'" app/Http/Controllers/Api/AuthController.php | head -n 5
          echo '--- STORAGE LINK ---'
          ls -ld public/storage
          REMOTE

      - name: Verify production login contract
        run: |
          response=$(curl -sS -X POST 'https://used.pm.sa/api/auth/login' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"phone":"966500000000","pin":"1234","device_name":"deploy-check"}')
          echo "$response"
          if printf '%s' "$response" | grep -qi 'password field is required'; then
            echo 'Production is still using the old password login contract.'
            exit 1
          fi
          echo 'LOGIN_CONTRACT=PIN'

      - name: Verify in-app registration contract
        run: |
          set -eu
          USERNAME="deploycheck$(date +%s)"
          PIN="648271"

          REGISTER_STATUS=$(curl -sS -o /tmp/register.json -w '%{http_code}' -X POST 'https://used.pm.sa/api/auth/register' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"Deploy Check\",\"username\":\"$USERNAME\",\"pin\":\"$PIN\",\"device_name\":\"github-deploy-check\"}")
          test "$REGISTER_STATUS" = "200"
          TOKEN=$(jq -r '.token // empty' /tmp/register.json)
          test -n "$TOKEN"

          LOGIN_STATUS=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST 'https://used.pm.sa/api/auth/login' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "{\"username\":\"$USERNAME\",\"pin\":\"$PIN\",\"device_name\":\"github-login-check\"}")
          test "$LOGIN_STATUS" = "200"
          test -n "$(jq -r '.token // empty' /tmp/login.json)"

          DELETE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE 'https://used.pm.sa/api/account' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $TOKEN")
          test "$DELETE_STATUS" = "204"
          echo 'IN_APP_REGISTRATION=READY'
