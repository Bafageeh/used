name: Deploy Used Marketplace

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: used-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_deploy_key
          chmod 600 ~/.ssh/used_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Prepare Laravel and upload code
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH' && if [ ! -f '$DEPLOY_PATH/artisan' ]; then composer create-project laravel/laravel '$DEPLOY_PATH' --no-interaction; cd '$DEPLOY_PATH' && php artisan install:api --no-interaction; fi"
          tar -C backend -czf /tmp/used-backend.tgz .
          scp -i ~/.ssh/used_deploy_key -P "$SERVER_PORT" /tmp/used-backend.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-backend.tgz"
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "tar -C '$DEPLOY_PATH' -xzf /tmp/used-backend.tgz"
      - name: Configure and migrate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -i ~/.ssh/used_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && sed -i 's|^APP_ENV=.*|APP_ENV=production|; s|^APP_DEBUG=.*|APP_DEBUG=false|; s|^APP_URL=.*|APP_URL=https://used.pm.sa|; s|^DB_CONNECTION=.*|DB_CONNECTION=mysql|; s|^DB_HOST=.*|DB_HOST=$DB_HOST|; s|^DB_PORT=.*|DB_PORT=$DB_PORT|; s|^DB_DATABASE=.*|DB_DATABASE=$DB_DATABASE|; s|^DB_USERNAME=.*|DB_USERNAME=$DB_USERNAME|; s|^DB_PASSWORD=.*|DB_PASSWORD=$DB_PASSWORD|' .env && if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi && php artisan migrate --force && php artisan storage:link || true && php artisan optimize:clear && php artisan optimize"
      - name: Verify API
        run: curl --fail --retry 5 --retry-delay 5 https://used.pm.sa/api/health
