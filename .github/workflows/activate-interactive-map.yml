name: Activate Interactive Map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-interactive-map.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire map screen into app
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()

          old = "import AgeGate from './AgeGate';\n"
          assert old in s
          s = s.replace(old, old + "import ListingsMap from './ListingsMap';\n", 1)

          old = "type Screen = 'home' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'blocked' | 'privacy' | 'terms' | 'admin';"
          new = "type Screen = 'home' | 'map' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'blocked' | 'privacy' | 'terms' | 'admin';"
          assert old in s
          s = s.replace(old, new, 1)

          old = "<Pressable style={styles.filterChip} onPress={() => Alert.alert('الخريطة', 'واجهة الخريطة جاهزة كخيار، وسيتم تفعيل الخريطة التفاعلية في النسخة المبنية خارج Expo Go.') }>\n          <Ionicons name=\"map-outline\" size={19} color={PURPLE} />\n          <Text style={styles.filterChipText}>الخريطة</Text>\n        </Pressable>"
          new = "<Pressable style={styles.filterChip} onPress={() => setScreen('map')}>\n          <Ionicons name=\"map-outline\" size={19} color={PURPLE} />\n          <Text style={styles.filterChipText}>الخريطة</Text>\n        </Pressable>"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  let content = homeContent;\n"
          new = "  let content = homeContent;\n  if (screen === 'map') content = <ListingsMap listings={visibleListings} onBack={() => setScreen('home')} onOpenListing={(id) => { setScreen('home'); void openDetail(id); }} />;\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  const isHome = screen === 'home';"
          new = "  const isHome = screen === 'home' || screen === 'map';"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: TypeScript check
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "feat: enable interactive map for listings"
          git push origin main
