name: Fix Add Category Dropdown

on:
  push:
    paths:
      - '.github/workflows/fix-add-category-dropdown.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Patch listing category UI
        run: python3 .github/scripts/patch_listing_dropdown.py

      - name: Validate mobile
        run: |
          cd mobile
          npm install --no-audit --no-fund
          npx tsc --noEmit
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx
          git commit -m 'Use dropdown for listing category' || exit 0
          git push origin main

      - name: Restart Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/start-expo.yml/dispatches \
            -d '{"ref":"main"}'
