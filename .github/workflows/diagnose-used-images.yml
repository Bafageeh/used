name: Diagnose Used Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-used-images.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_diag_key
          chmod 600 ~/.ssh/used_diag_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect latest upload failure
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_diag_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          set -u
          API_PATH='${{ secrets.DEPLOY_PATH }}/api'
          cd "$API_PATH" || exit 1
          echo '--- LATEST LISTINGS / IMAGE COUNTS ---'
          php artisan tinker --execute="
          foreach (Illuminate\\Support\\Facades\\DB::table('listings')->orderByDesc('id')->limit(8)->get(['id','title','user_id','created_at']) as \$l) {
            \$count = Illuminate\\Support\\Facades\\DB::table('listing_images')->where('listing_id', \$l->id)->count();
            echo 'LISTING id='.\$l->id.' title='.\$l->title.' user='.\$l->user_id.' images='.\$count.' created='.\$l->created_at.PHP_EOL;
          }
          " || true
          echo '--- LATEST IMAGE ROWS ---'
          php artisan tinker --execute="
          foreach (Illuminate\\Support\\Facades\\DB::table('listing_images')->orderByDesc('id')->limit(12)->get(['id','listing_id','path','sort_order']) as \$img) {
            \$exists = Illuminate\\Support\\Facades\\Storage::disk('public')->exists(\$img->path) ? 'YES' : 'NO';
            echo 'IMAGE id='.\$img->id.' listing='.\$img->listing_id.' path='.\$img->path.' file='.\$exists.PHP_EOL;
          }
          " || true
          echo '--- STORAGE / PERMISSIONS ---'
          id || true
          ls -ld storage storage/app storage/app/public storage/app/public/listings storage/logs bootstrap/cache public public/storage 2>&1 || true
          readlink -f public/storage 2>/dev/null || true
          echo '--- LATEST LARAVEL LOG ---'
          latest=$(ls -1t storage/logs/*.log 2>/dev/null | head -n 1 || true)
          echo "LOG=$latest"
          if [ -n "$latest" ]; then
            tail -n 180 "$latest" || true
          fi
          echo '--- DISK CONFIG ---'
          php artisan tinker --execute="echo json_encode(config('filesystems.disks.public'), JSON_PRETTY_PRINT);" || true
          REMOTE
