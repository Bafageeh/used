name: Diagnose Used Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-used-images.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_diag_key
          chmod 600 ~/.ssh/used_diag_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect image records files and public URLs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_diag_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          set -eu
          cd '${{ secrets.DEPLOY_PATH }}/api'
          php artisan tinker --execute="
          foreach (Illuminate\\Support\\Facades\\DB::table('listings')->orderByDesc('id')->limit(8)->get(['id','title']) as \$l) {
            \$count = Illuminate\\Support\\Facades\\DB::table('listing_images')->where('listing_id', \$l->id)->count();
            echo 'LISTING id='.\$l->id.' title='.\$l->title.' images='.\$count.PHP_EOL;
          }
          foreach (Illuminate\\Support\\Facades\\DB::table('listing_images')->orderByDesc('id')->limit(12)->get(['id','listing_id','path']) as \$img) {
            \$exists = Illuminate\\Support\\Facades\\Storage::disk('public')->exists(\$img->path) ? 'YES' : 'NO';
            echo 'IMAGE id='.\$img->id.' listing='.\$img->listing_id.' path='.\$img->path.' file='.\$exists.PHP_EOL;
          }
          "
          echo '--- STORAGE LINK ---'
          ls -ld public/storage || true
          echo '--- STORAGE FILES ---'
          find storage/app/public/listings -type f -printf '%P\n' 2>/dev/null | tail -n 20 || true
          REMOTE

      - name: Test latest public image URL
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          path=$(ssh -i ~/.ssh/used_diag_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH/api' && php artisan tinker --execute=\"echo optional(Illuminate\\\\Support\\\\Facades\\\\DB::table('listing_images')->orderByDesc('id')->first())->path;\"" 2>/dev/null | tr -d '\r\n')
          echo "LATEST_PATH=$path"
          if [ -n "$path" ]; then
            echo '--- HEAD /storage ---'
            curl -sS -I "https://used.pm.sa/storage/$path" | head -n 8
          fi
