name: Fix Phone Authentication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-phone-auth.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore phone login and verified phone registration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('mobile/App.tsx')
          app = app_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              "  const [registrationUsername, setRegistrationUsername] = useState('');\n",
              "  const [otpCode, setOtpCode] = useState('');\n  const [registrationOtpSent, setRegistrationOtpSent] = useState(false);\n",
              'registration state',
          )

          app = replace_once(
              app,
              "        const identifier = phone.trim();\n        const credentials = /^\\d/.test(identifier)\n          ? { phone: normalizedPhone() }\n          : { username: identifier.toLowerCase() };\n        if (!/^\\d{4,8}$/.test(pin)) throw new Error('أدخل الرقم السري من 4 إلى 8 أرقام.');\n        result = await request<{ token: string; user: User }>('/auth/login', {\n          method: 'POST', body: JSON.stringify({ ...credentials, pin, device_name: 'Tanazul Mobile' }),\n        });",
              "        const loginPhone = normalizedPhone();\n        if (!/^\\d{4,8}$/.test(pin)) throw new Error('أدخل الرقم السري من 4 إلى 8 أرقام.');\n        result = await request<{ token: string; user: User }>('/auth/login', {\n          method: 'POST', body: JSON.stringify({ phone: loginPhone, pin, device_name: 'Tanazul Mobile' }),\n        });",
              'phone-only login',
          )

          old_register = """  const registerAccount = async () => {
    setBusy(true);
    try {
      if (!ageVerified) throw new Error('يجب التحقق من العمر قبل إنشاء الحساب.');
      if (!termsAccepted) throw new Error('يجب الموافقة على الشروط والأحكام وسياسة الخصوصية أولاً.');
      if (!name.trim()) throw new Error('أدخل اسمك.');
      const normalizedUsername = registrationUsername.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,30}$/.test(normalizedUsername)) throw new Error('اسم المستخدم يجب أن يكون من 3 إلى 30 حرفًا إنجليزيًا أو رقمًا، ويمكن استخدام _.');
      if (!/^\\d{4,8}$/.test(pin)) throw new Error('اختر رقمًا سريًا من 4 إلى 8 أرقام.');
      const result = await request<{ token: string; user: User }>('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name: name.trim(), username: normalizedUsername, pin, device_name: 'Tanazul Mobile' }),
      });
      onLogin(result.token, result.user);
      Alert.alert('تم إنشاء الحساب', 'أصبح حسابك جاهزًا ويمكنك استخدام جميع ميزات تنازل.');
    } catch (e) {
      Alert.alert('تعذر إنشاء الحساب', e instanceof Error ? e.message : 'حدث خطأ غير متوقع.');
    } finally {
      setBusy(false);
    }
  };
"""
          new_register = """  const registerAccount = async () => {
    setBusy(true);
    try {
      if (!ageVerified) throw new Error('يجب التحقق من العمر قبل إنشاء الحساب.');
      if (!termsAccepted) throw new Error('يجب الموافقة على الشروط والأحكام وسياسة الخصوصية أولاً.');
      if (!name.trim()) throw new Error('أدخل اسمك.');
      const registrationPhone = normalizedPhone();
      if (!/^\\d{4,8}$/.test(pin)) throw new Error('اختر رقمًا سريًا من 4 إلى 8 أرقام.');

      if (!registrationOtpSent) {
        await request<{ message: string; expires_in?: number }>('/auth/request-otp', {
          method: 'POST',
          body: JSON.stringify({ phone: registrationPhone, purpose: 'register' }),
        });
        setRegistrationOtpSent(true);
        Alert.alert('رمز التحقق', 'تم إرسال رمز التحقق إلى رقم الجوال المسجل.');
        return;
      }

      if (!/^\\d{6}$/.test(otpCode)) throw new Error('أدخل رمز التحقق المكوّن من 6 أرقام.');
      const result = await request<{ token: string; user: User }>('/auth/verify-otp', {
        method: 'POST',
        body: JSON.stringify({
          phone: registrationPhone,
          purpose: 'register',
          code: otpCode,
          name: name.trim(),
          pin,
          device_name: 'Tanazul Mobile',
        }),
      });
      onLogin(result.token, result.user);
      Alert.alert('تم إنشاء الحساب', 'أصبح حسابك جاهزًا ويمكنك استخدام جميع ميزات تنازل.');
    } catch (e) {
      Alert.alert('تعذر إنشاء الحساب', e instanceof Error ? e.message : 'حدث خطأ غير متوقع.');
    } finally {
      setBusy(false);
    }
  };
"""
          app = replace_once(app, old_register, new_register, 'registration flow')

          app = replace_once(
              app,
              "  const changeMode = (next: 'user' | 'register' | 'admin') => {\n    setMode(next);\n    setAgeVerified(false);\n  };",
              "  const changeMode = (next: 'user' | 'register' | 'admin') => {\n    setMode(next);\n    setAgeVerified(false);\n    setRegistrationOtpSent(false);\n    setOtpCode('');\n  };",
              'mode reset',
          )

          app = replace_once(
              app,
              "      ? 'أنشئ حسابك من داخل التطبيق باسم مستخدم ورقم سري.'",
              "      ? 'أنشئ حسابك برقم الجوال ورقم سري، ثم أكّد رمز التحقق.'",
              'registration help',
          )

          app = replace_once(
              app,
              "        <View style={styles.inputShell}><Ionicons name=\"at-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={registrationUsername} onChangeText={setRegistrationUsername} placeholder=\"اسم المستخدم بالإنجليزية\" autoCapitalize=\"none\" autoCorrect={false} textAlign=\"right\" /></View>\n",
              "        <View style={styles.inputShell}><Ionicons name=\"call-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={phone} onChangeText={(value) => { setPhone(value); if (registrationOtpSent) { setRegistrationOtpSent(false); setOtpCode(''); } }} placeholder=\"رقم الجوال مثل 05xxxxxxxx\" keyboardType=\"phone-pad\" textContentType=\"telephoneNumber\" autoComplete=\"tel\" textAlign=\"right\" /></View>\n        {registrationOtpSent ? <View style={styles.inputShell}><Ionicons name=\"keypad-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={otpCode} onChangeText={setOtpCode} placeholder=\"رمز التحقق المكوّن من 6 أرقام\" keyboardType=\"number-pad\" maxLength={6} textContentType=\"oneTimeCode\" autoComplete=\"sms-otp\" textAlign=\"right\" /></View> : null}\n",
              'registration phone field',
          )

          app = replace_once(
              app,
              "        <Pressable style={[styles.primaryButton, busy && styles.disabled]} onPress={registerAccount} disabled={busy}>{busy ? <ActivityIndicator color=\"#fff\" /> : <Text style={styles.primaryButtonText}>إنشاء الحساب</Text>}</Pressable>",
              "        <Pressable style={[styles.primaryButton, busy && styles.disabled]} onPress={registerAccount} disabled={busy}>{busy ? <ActivityIndicator color=\"#fff\" /> : <Text style={styles.primaryButtonText}>{registrationOtpSent ? 'تأكيد وإنشاء الحساب' : 'إرسال رمز التحقق'}</Text>}</Pressable>",
              'registration button',
          )

          app = replace_once(
              app,
              "        <View style={styles.inputShell}><Ionicons name=\"person-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={phone} onChangeText={setPhone} placeholder=\"رقم الجوال أو اسم المستخدم\" autoCapitalize=\"none\" autoCorrect={false} textAlign=\"right\" /></View>",
              "        <View style={styles.inputShell}><Ionicons name=\"call-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={phone} onChangeText={setPhone} placeholder=\"رقم الجوال\" keyboardType=\"phone-pad\" textContentType=\"telephoneNumber\" autoComplete=\"tel\" textAlign=\"right\" /></View>",
              'login phone field',
          )

          app_path.write_text(app)

          auth_path = Path('api/app/Http/Controllers/Api/AuthController.php')
          auth = auth_path.read_text()
          auth = replace_once(
              auth,
              "'message' => 'تعذر إرسال رمز التحقق عبر واتساب. حاول مرة أخرى.',",
              "'message' => 'تعذر إرسال رمز التحقق. حاول مرة أخرى.',",
              'generic OTP error',
          )
          auth = replace_once(
              auth,
              "return ['message' => 'تم إرسال رمز التحقق عبر واتساب.', 'expires_in' => 300];",
              "return ['message' => 'تم إرسال رمز التحقق.', 'expires_in' => 300];",
              'generic OTP success',
          )
          auth_path.write_text(auth)

          # User-facing checks: normal users authenticate only with phone and no provider brand is exposed.
          final_app = app_path.read_text()
          final_auth = auth_path.read_text()
          assert 'رقم الجوال أو اسم المستخدم' not in final_app
          assert 'اسم المستخدم بالإنجليزية' not in final_app
          assert 'registrationUsername' not in final_app
          assert 'واتساب' not in final_app
          assert 'عبر واتساب' not in final_auth
          assert "body: JSON.stringify({ phone: loginPhone, pin, device_name: 'Tanazul Mobile' })" in final_app
          assert "purpose: 'register'" in final_app
          assert "textContentType=\"oneTimeCode\"" in final_app
          PY

      - name: Validate iOS JavaScript bundle
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform ios --output-dir /tmp/tanazul-ios-export

      - name: Commit fix
        run: |
          git config user.name "Bafageeh"
          git config user.email "a.baf@live.com"
          git add mobile/App.tsx api/app/Http/Controllers/Api/AuthController.php
          git diff --cached --check
          git commit -m "fix: restore phone login and verified registration"
          git push origin main
