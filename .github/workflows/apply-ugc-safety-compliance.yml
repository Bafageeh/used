      - name: Add moderation queue to admin panel
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('mobile/AdminPanel.tsx'); s=p.read_text()
          s=s.replace("type Tab = 'dashboard'|'users'|'listings'|'categories'|'settings';", "type Tab = 'dashboard'|'users'|'listings'|'reports'|'categories'|'settings';",1)
          marker="type Setting = { key:string; value?:string|null; label?:string|null; group:string; type:string };"
          assert marker in s
          s=s.replace(marker,marker+"\ntype Report = { id:number; target_type:string; reason:string; details?:string|null; status:string; created_at?:string; reported_user_id?:number|null; reported_user_name?:string|null; listing_id?:number|null; listing_title?:string|null; listing_status?:string|null; message_id?:number|null; message_body?:string|null; reporter_name?:string|null };",1)
          old="const [dash,setDash]=useState<any>({}); const [users,setUsers]=useState<User[]>([]); const [listings,setListings]=useState<Listing[]>([]); const [categories,setCategories]=useState<Category[]>([]); const [settings,setSettings]=useState<Setting[]>([]);"
          assert old in s
          s=s.replace(old,"const [dash,setDash]=useState<any>({}); const [users,setUsers]=useState<User[]>([]); const [listings,setListings]=useState<Listing[]>([]); const [reports,setReports]=useState<Report[]>([]); const [categories,setCategories]=useState<Category[]>([]); const [settings,setSettings]=useState<Setting[]>([]);",1)
          marker="      if(tab==='listings') { const r=await api<{data:Listing[]}>(`/admin/listings${q?`?q=${encodeURIComponent(q)}`:''}`,token); setListings(r.data||[]); }"
          assert marker in s
          s=s.replace(marker,marker+"\n      if(tab==='reports') { const r=await api<{data:Report[]}>('/admin/reports',token); setReports(r.data||[]); }",1)
          marker="  const removeListing=(l:Listing)=>Alert.alert('حذف الإعلان'"
          idx=s.find(marker); assert idx>=0
          # insert helper immediately before removeListing definition
          helper="  const moderateReport=async(r:Report,status:'resolved'|'dismissed',action:'none'|'archive_listing'|'suspend_user'='none')=>{try{await api(`/admin/reports/${r.id}`,token,{method:'PATCH',body:JSON.stringify({status,action})});await load();}catch(e){Alert.alert('البلاغ',e instanceof Error?e.message:'تعذر تحديث البلاغ');}};\n"
