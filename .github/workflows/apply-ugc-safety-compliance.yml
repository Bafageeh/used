          marker="      {tab==='categories'?<View>"
          assert marker in s
          block="""      {tab==='reports'?<View><Text style={s.title}>بلاغات المحتوى والمستخدمين</Text><Text style={s.meta}>يجب مراجعة البلاغات واتخاذ إجراء مناسب في الوقت المناسب.</Text>{reports.length?reports.map(r=><View key={r.id} style={s.card}><View style={s.cardTop}><View style={[s.badge,s.bad]}><Text style={[s.badgeText,{color:'#B91C1C'}]}>بلاغ #{r.id}</Text></View><View style={{flex:1,alignItems:'flex-end'}}><Text style={s.cardTitle}>{r.target_type==='listing'?`إعلان: ${r.listing_title||r.listing_id}`:r.target_type==='message'?'رسالة في المحادثة':`مستخدم: ${r.reported_user_name||r.reported_user_id}`}</Text><Text style={s.meta}>السبب: {r.reason} • المبلّغ: {r.reporter_name||'مستخدم'}</Text>{r.message_body?<Text numberOfLines={3} style={s.meta}>{r.message_body}</Text>:null}{r.details?<Text numberOfLines={3} style={s.meta}>{r.details}</Text>:null}</View></View><View style={s.actionRow}>{r.listing_id?<Pressable style={s.small} onPress={()=>moderateReport(r,'resolved','archive_listing')}><Text style={s.smallText}>أرشفة الإعلان</Text></Pressable>:null}{r.reported_user_id?<Pressable style={s.del} onPress={()=>moderateReport(r,'resolved','suspend_user')}><Text style={s.delText}>إيقاف المستخدم</Text></Pressable>:null}<Pressable style={s.small} onPress={()=>moderateReport(r,'resolved','none')}><Text style={s.smallText}>إغلاق البلاغ</Text></Pressable><Pressable style={s.cancel} onPress={()=>moderateReport(r,'dismissed','none')}><Text>رفض البلاغ</Text></Pressable></View></View>):<Text style={s.meta}>لا توجد بلاغات معلقة.</Text>}</View>:null}\n\n"""
          s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY

      - name: Add permission descriptions and legal age wording
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('mobile/app.json'); data=json.loads(p.read_text()); expo=data['expo']
          ios=expo.setdefault('ios',{}); info=ios.setdefault('infoPlist',{})
          info.update({
            'NSCameraUsageDescription':'يستخدم مستعمل مجاني الكاميرا عند اختيارك تصوير صور أو فيديو لإعلانك.',
            'NSPhotoLibraryUsageDescription':'يستخدم مستعمل مجاني مكتبة الصور عند اختيارك صورًا أو فيديو لإعلانك.',
            'NSMicrophoneUsageDescription':'يستخدم مستعمل مجاني الميكروفون عند اختيارك تسجيل فيديو للإعلان.',
            'NSLocationWhenInUseUsageDescription':'يستخدم مستعمل مجاني موقعك فقط عند اختيارك إضافة موقع الإعلان أو ترتيب الإعلانات القريبة.'
          })
          android=expo.setdefault('android',{}); android['permissions']=['CAMERA','RECORD_AUDIO','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_MEDIA_IMAGES','READ_MEDIA_VIDEO']
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")

          p=Path('mobile/LegalScreen.tsx'); s=p.read_text()
