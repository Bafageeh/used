name: Apply UGC Safety Compliance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ugc-safety-compliance.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply API blocking filtering and moderation routes
        run: |
          set -euo pipefail
          cat > api/app/Http/Controllers/Api/ListingController.php <<'PHP'
          <?php

          namespace App\Http\Controllers\Api;

          use App\Http\Controllers\Controller;
          use App\Models\Listing;
          use App\Services\ContentSafety;
          use Illuminate\Http\Request;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Storage;
          use Illuminate\Validation\Rule;

          class ListingController extends Controller
          {
           public function index(Request $request) {
            $viewerId = auth('sanctum')->id();
            $blocked = $this->blockedUserIds($viewerId);
            return Listing::query()->with(['category:id,name,slug','images:id,listing_id,path,sort_order','user:id,name'])
             ->where('status','published')
             ->when($blocked, fn ($q) => $q->whereNotIn('user_id', $blocked))
             ->when($request->filled('q'), function ($query) use ($request) {
              $term='%'.$request->string('q')->trim().'%';
              $query->where(function ($inner) use ($term) { $inner->where('title','like',$term)->orWhere('description','like',$term); });
             })
             ->when($request->filled('category_id'), fn ($q) => $q->where('category_id',$request->integer('category_id')))
             ->when($request->filled('city'), fn ($q) => $q->where('city',$request->string('city')))
             ->latest('published_at')->paginate(20);
           }
           public function show(Listing $listing) {
            $viewerId = auth('sanctum')->id();
            abort_unless($listing->status==='published' || $viewerId===$listing->user_id,404);
            if ($viewerId && $viewerId !== $listing->user_id && $this->blockedBetween($viewerId, $listing->user_id)) abort(404);
            if ($listing->status === 'published' && $viewerId !== $listing->user_id) $listing->increment('views_count');
            $listing->load(['category','images','user:id,name,phone']);
            if (!$listing->show_phone) $listing->user->makeHidden('phone');
            return $listing;
           }
           public function mine(Request $request) {
            return $request->user()->listings()->with(['category:id,name,slug','images'])->latest()->paginate(20);
           }
           public function store(Request $request, ContentSafety $safety) {
            $data=$this->validated($request); $safety->ensureAllowed($data['title'],$data['description']);
            $data['price']=null; $data['user_id']=$request->user()->id;
            $data['item_condition']=$data['item_condition'] ?? 'used_good';
            $data['published_at']=$data['status']==='published'?now():null;
            return response()->json(Listing::create($data),201);
           }
           public function update(Request $request, Listing $listing, ContentSafety $safety) {
            abort_unless($request->user()->id===$listing->user_id,403); $data=$this->validated($request);
            $safety->ensureAllowed($data['title'],$data['description']); $data['price']=null;
            if (($data['status'] ?? null)==='published' && !$listing->published_at) $data['published_at']=now();
            $listing->update($data); return $listing->fresh(['category','images']);
           }
           public function refresh(Request $request, Listing $listing) {
            abort_unless($request->user()->id===$listing->user_id,403);
            $listing->forceFill(['status'=>'published','published_at'=>now()])->save();
            return $listing->fresh(['category','images']);
           }
           public function destroy(Request $request, Listing $listing) {
            abort_unless($request->user()->id===$listing->user_id,403);
            $paths=$listing->images()->pluck('path')->filter()->all();
            if ($paths) Storage::disk('public')->delete($paths);
            if ($listing->video_path) Storage::disk('public')->delete($listing->video_path);
            Storage::disk('public')->deleteDirectory("listings/{$listing->id}");
            $listing->delete();
            return response()->noContent();
           }
           private function validated(Request $request): array {
            return $request->validate([
             'category_id'=>['required','exists:categories,id'],'title'=>['required','string','max:120'],
             'description'=>['required','string','max:5000'],
             'item_condition'=>['sometimes',Rule::in(['new_good','new_defect','used_good','used_defect'])],
             'city'=>['required','string','max:80'],'latitude'=>['nullable','numeric','between:-90,90'],
             'longitude'=>['nullable','numeric','between:-180,180'],'status'=>['required',Rule::in(['draft','published','sold','archived'])],
             'show_phone'=>['sometimes','boolean'],
            ]);
           }
           private function blockedUserIds(?int $userId): array {
            if (!$userId) return [];
            $a=DB::table('user_blocks')->where('blocker_id',$userId)->pluck('blocked_id')->all();
            $b=DB::table('user_blocks')->where('blocked_id',$userId)->pluck('blocker_id')->all();
            return array_values(array_unique(array_map('intval',array_merge($a,$b))));
           }
           private function blockedBetween(int $a, int $b): bool {
            return DB::table('user_blocks')->where(fn($q)=>$q->where('blocker_id',$a)->where('blocked_id',$b))->orWhere(fn($q)=>$q->where('blocker_id',$b)->where('blocked_id',$a))->exists();
           }
          }
          PHP

          cat > api/app/Http/Controllers/Api/ConversationController.php <<'PHP'
          <?php

          namespace App\Http\Controllers\Api;

          use App\Http\Controllers\Controller;
          use App\Models\Conversation;
          use App\Models\Listing;
          use App\Models\Message;
          use App\Services\ContentSafety;
          use Illuminate\Http\Request;
          use Illuminate\Support\Facades\DB;

          class ConversationController extends Controller
          {
              public function index(Request $request)
              {
                  $userId = $request->user()->id;
                  $blocked = $this->blockedUserIds($userId);
                  $rows = Conversation::query()
                      ->where(fn ($q) => $q->where('buyer_id', $userId)->orWhere('seller_id', $userId))
                      ->when($blocked, fn($q)=>$q->whereNotIn('buyer_id',$blocked)->whereNotIn('seller_id',$blocked))
                      ->with(['listing:id,user_id,title,status','listing.images','buyer:id,name','seller:id,name','lastMessage.sender:id,name'])
                      ->withCount(['messages as unread_count' => fn ($q) => $q->where('sender_id', '!=', $userId)->whereNull('read_at')])
                      ->orderByDesc('last_message_at')->orderByDesc('updated_at')->get();
                  return response()->json($rows);
              }

              public function start(Request $request, Listing $listing)
              {
                  $user = $request->user();
                  abort_unless($listing->status === 'published', 404);
                  abort_if($listing->user_id === $user->id, 422, 'لا يمكنك مراسلة نفسك على إعلانك.');
                  abort_if($this->blockedBetween($user->id,$listing->user_id), 403, 'لا يمكن بدء محادثة مع مستخدم محظور.');
                  $conversation = Conversation::firstOrCreate(['listing_id'=>$listing->id,'buyer_id'=>$user->id,'seller_id'=>$listing->user_id]);
                  return response()->json($this->loadConversation($conversation, $user->id), $conversation->wasRecentlyCreated ? 201 : 200);
              }

              public function messages(Request $request, Conversation $conversation)
              {
                  $this->authorizeParticipant($request, $conversation);
                  $userId = $request->user()->id; $other=$conversation->buyer_id===$userId?$conversation->seller_id:$conversation->buyer_id;
                  abort_if($this->blockedBetween($userId,$other),403,'هذه المحادثة متوقفة بسبب الحظر.');
                  Message::query()->where('conversation_id',$conversation->id)->where('sender_id','!=',$userId)->whereNull('read_at')->update(['read_at'=>now(),'updated_at'=>now()]);
                  $conversation->load(['listing:id,user_id,title,status','listing.images','buyer:id,name','seller:id,name']);
                  $messages=$conversation->messages()->with('sender:id,name')->latest('id')->limit(100)->get()->reverse()->values();
                  return response()->json(['conversation'=>$conversation,'messages'=>$messages]);
              }

              public function send(Request $request, Conversation $conversation, ContentSafety $safety)
              {
                  $this->authorizeParticipant($request, $conversation);
                  $userId=$request->user()->id; $other=$conversation->buyer_id===$userId?$conversation->seller_id:$conversation->buyer_id;
                  abort_if($this->blockedBetween($userId,$other),403,'لا يمكن إرسال رسائل إلى مستخدم محظور.');
                  $data=$request->validate(['body'=>['required','string','max:2000']]);
                  $body=trim($data['body']); abort_if($body==='',422,'اكتب الرسالة أولاً.'); $safety->ensureAllowed($body);
                  $message=$conversation->messages()->create(['sender_id'=>$userId,'body'=>$body]);
                  $conversation->forceFill(['last_message_at'=>$message->created_at])->save();
                  return response()->json($message->load('sender:id,name'),201);
              }

              public function unreadCount(Request $request)
              {
                  $userId=$request->user()->id; $blocked=$this->blockedUserIds($userId);
                  $count=Message::query()->where('sender_id','!=',$userId)->whereNull('read_at')
                      ->whereHas('conversation',fn($q)=>$q->where(fn($x)=>$x->where('buyer_id',$userId)->orWhere('seller_id',$userId))->when($blocked,fn($x)=>$x->whereNotIn('buyer_id',$blocked)->whereNotIn('seller_id',$blocked)))->count();
                  return response()->json(['count'=>$count]);
              }

              public function notifications(Request $request)
              {
                  $userId=$request->user()->id; $blocked=$this->blockedUserIds($userId);
                  $rows=Message::query()->where('sender_id','!=',$userId)
                      ->whereHas('conversation',fn($q)=>$q->where(fn($x)=>$x->where('buyer_id',$userId)->orWhere('seller_id',$userId))->when($blocked,fn($x)=>$x->whereNotIn('buyer_id',$blocked)->whereNotIn('seller_id',$blocked)))
                      ->with(['sender:id,name','conversation:id,listing_id,buyer_id,seller_id,last_message_at','conversation.listing:id,user_id,title,status','conversation.listing.images','conversation.buyer:id,name','conversation.seller:id,name'])
                      ->latest('id')->limit(30)->get();
                  return response()->json($rows);
              }

              private function authorizeParticipant(Request $request, Conversation $conversation): void
              { $userId=$request->user()->id; abort_unless($conversation->buyer_id===$userId || $conversation->seller_id===$userId,403); }
              private function loadConversation(Conversation $conversation,int $userId): Conversation
              { return $conversation->load(['listing:id,user_id,title,status','listing.images','buyer:id,name','seller:id,name','lastMessage.sender:id,name'])->loadCount(['messages as unread_count'=>fn($q)=>$q->where('sender_id','!=',$userId)->whereNull('read_at')]); }
              private function blockedUserIds(int $userId): array
              { $a=DB::table('user_blocks')->where('blocker_id',$userId)->pluck('blocked_id')->all(); $b=DB::table('user_blocks')->where('blocked_id',$userId)->pluck('blocker_id')->all(); return array_values(array_unique(array_map('intval',array_merge($a,$b)))); }
              private function blockedBetween(int $a,int $b): bool
              { return DB::table('user_blocks')->where(fn($q)=>$q->where('blocker_id',$a)->where('blocked_id',$b))->orWhere(fn($q)=>$q->where('blocker_id',$b)->where('blocked_id',$a))->exists(); }
          }
          PHP

          python3 <<'PY'
          from pathlib import Path
          p=Path('api/routes/api.php'); s=p.read_text()
          s=s.replace("use App\\Http\\Controllers\\Api\\ListingVideoController;", "use App\\Http\\Controllers\\Api\\ListingVideoController;\nuse App\\Http\\Controllers\\Api\\ModerationController;\nuse App\\Http\\Controllers\\Api\\AdminModerationController;",1)
          marker="    Route::get('/message-notifications',[ConversationController::class,'notifications']);"
          assert marker in s
          s=s.replace(marker, marker+"\n\n    Route::post('/reports/listings/{listing}',[ModerationController::class,'reportListing']);\n    Route::post('/reports/users/{user}',[ModerationController::class,'reportUser']);\n    Route::post('/reports/messages/{message}',[ModerationController::class,'reportMessage']);\n    Route::get('/blocks',[ModerationController::class,'blocks']);\n    Route::post('/blocks/{user}',[ModerationController::class,'block']);\n    Route::delete('/blocks/{user}',[ModerationController::class,'unblock']);",1)
          marker="        Route::get('/settings',[AdminController::class,'settings']);"
          assert marker in s
          s=s.replace(marker,"        Route::get('/reports',[AdminModerationController::class,'index']); Route::patch('/reports/{report}',[AdminModerationController::class,'update']);\n"+marker,1)
          p.write_text(s)
          PY

      - name: Wire safety UI age gate and blocked users
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('mobile/App.tsx'); s=p.read_text()
          s=s.replace("import LegalScreen from './LegalScreen';", "import LegalScreen from './LegalScreen';\nimport AgeGate, { AGE_GATE_KEY } from './AgeGate';\nimport { BlockedUsersPanel, ChatSafetyActions, ListingSafetyActions, ReportMessageButton } from './Moderation';",1)
          s=s.replace("type Screen = 'home' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'privacy' | 'terms' | 'admin';", "type Screen = 'home' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'blocked' | 'privacy' | 'terms' | 'admin';",1)
          marker="  const [authRestoring, setAuthRestoring] = useState(true);"
          assert marker in s
          s=s.replace(marker, marker+"\n  const [ageAllowed, setAgeAllowed] = useState<boolean | null>(null);",1)
          s=s.replace("request<Paginated<Listing>>(listingsPath),", "request<Paginated<Listing>>(listingsPath, {}, token || undefined),",1)
          s=s.replace("  }, [listingsPath]);", "  }, [listingsPath, token]);",1)
          marker="  useEffect(() => { loadHome(); }, [loadHome, refreshKey]);"
          assert marker in s
          s=s.replace(marker, marker+"\n\n  useEffect(() => {\n    SecureStore.getItemAsync(AGE_GATE_KEY).then((value) => setAgeAllowed(value === 'yes')).catch(() => setAgeAllowed(false));\n  }, []);",1)

          marker="      <View style={styles.messageComposer}>"
          assert marker in s
          s=s.replace(marker, "      <ChatSafetyActions token={token} userId={userId} conversation={meta} onBlocked={onBack} />\n"+marker,1)
          old="                  <Text style={[styles.messageTime, mine && styles.messageTimeMine]}>{relativeTime(message.created_at)}</Text>\n                </View>"
          assert old in s
          s=s.replace(old,"                  <Text style={[styles.messageTime, mine && styles.messageTimeMine]}>{relativeTime(message.created_at)}</Text>\n                  {!mine ? <ReportMessageButton token={token} messageId={message.id} /> : null}\n                </View>",1)

          marker="            {!isOwner && detail.user ? (\n              <Pressable style={styles.contactSellerButton} onPress={() => void startConversationForListing(detail)}>"
          assert marker in s
          # keep contact button, then inject safety group after its closing block
          close="            ) : null}\n\n            {isOwner ? ("
          assert close in s
          s=s.replace(close,"            ) : null}\n\n            {!isOwner && detail.user && token ? <ListingSafetyActions token={token} listingId={detail.id} userId={detail.user.id} onBlocked={() => { setListings((current) => current.filter((x) => x.user?.id !== detail.user?.id)); setDetail(null); setRefreshKey((x) => x + 1); }} /> : null}\n\n            {isOwner ? (",1)

          marker="  if (detailLoading) return <View style={styles.center}><ActivityIndicator size=\"large\" color={PURPLE} /><Text style={styles.stateText}>جاري فتح الإعلان...</Text></View>;"
          assert marker in s
          s=s.replace(marker,"  if (ageAllowed === null) return <View style={styles.center}><ActivityIndicator size=\"large\" color={PURPLE} /><Text style={styles.stateText}>جاري التحقق...</Text></View>;\n  if (!ageAllowed) return <AgeGate onAllowed={() => setAgeAllowed(true)} />;\n\n"+marker,1)

          marker="      <Pressable style={styles.menuAction} onPress={() => setScreen('privacy')}><Ionicons name=\"shield-checkmark-outline\""
          assert marker in s
          s=s.replace(marker,"      <Pressable style={styles.menuAction} onPress={() => setScreen('blocked')}><Ionicons name=\"ban-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>المستخدمون المحظورون</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n"+marker,1)
          marker="  if (screen === 'privacy') content = <LegalScreen type=\"privacy\" />;"
          assert marker in s
          s=s.replace(marker,"  if (screen === 'blocked') content = token ? <BlockedUsersPanel token={token} /> : <LoginPanel onLogin={loggedIn} />;\n"+marker,1)
          s=s.replace("screen === 'mine' ? 'إعلاناتي' : screen === 'privacy' ?", "screen === 'mine' ? 'إعلاناتي' : screen === 'blocked' ? 'المستخدمون المحظورون' : screen === 'privacy' ?",1)
          marker="              ['favorites', 'heart-outline', 'المفضلة'],\n              ['privacy', 'shield-checkmark-outline', 'سياسة الخصوصية'],"
          assert marker in s
          s=s.replace(marker,"              ['favorites', 'heart-outline', 'المفضلة'],\n              ['blocked', 'ban-outline', 'المستخدمون المحظورون'],\n              ['privacy', 'shield-checkmark-outline', 'سياسة الخصوصية'],",1)
          p.write_text(s)
