name: Fix Store Legal Check V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-store-legal-check-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace npm ci with npm install
        run: |
          sed -i 's/npm ci --ignore-scripts/npm install/' .github/workflows/apply-store-legal-compliance.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add .github/workflows/apply-store-legal-compliance.yml
          git commit -m 'fix: legal compliance dependency install'
          git push origin main
