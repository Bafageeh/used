name: Apply Store Legal V3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-store-legal-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire legal screens into mobile app and API
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('mobile/App.tsx')
          s = p.read_text()

          old = "import AdminPanel from './AdminPanel';"
          new = "import AdminPanel from './AdminPanel';\nimport LegalScreen from './LegalScreen';"
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          old = "type Screen = 'home' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'admin';"
          new = "type Screen = 'home' | 'favorites' | 'add' | 'notifications' | 'messages' | 'mine' | 'account' | 'privacy' | 'terms' | 'admin';"
          if new not in s:
              assert old in s
              s = s.replace(old, new, 1)

          marker = "  const [busy, setBusy] = useState(false);\n\n  const normalizedPhone = () => {"
          if "const [termsAccepted, setTermsAccepted]" not in s:
              assert marker in s
              s = s.replace(marker, "  const [busy, setBusy] = useState(false);\n  const [termsAccepted, setTermsAccepted] = useState(false);\n\n  const normalizedPhone = () => {", 1)

          marker = "  const sendRegistrationOtp = async () => {\n    setBusy(true);\n    try {\n      const normalized = normalizedPhone();"
          if "sendRegistrationOtp = async" in s and "if (!termsAccepted) throw new Error('يجب الموافقة" not in s:
              assert marker in s
              s = s.replace(marker, "  const sendRegistrationOtp = async () => {\n    setBusy(true);\n    try {\n      if (!termsAccepted) throw new Error('يجب الموافقة على الشروط والأحكام وسياسة الخصوصية أولاً.');\n      const normalized = normalizedPhone();", 1)

          marker = "  const verifyRegistrationOtp = async () => {\n    setBusy(true);\n    try {\n      const normalized = normalizedPhone();"
          if s.count("if (!termsAccepted) throw new Error('يجب الموافقة") < 2:
              assert marker in s
              s = s.replace(marker, "  const verifyRegistrationOtp = async () => {\n    setBusy(true);\n    try {\n      if (!termsAccepted) throw new Error('يجب الموافقة على الشروط والأحكام وسياسة الخصوصية أولاً.');\n      const normalized = normalizedPhone();", 1)

          marker = "        <View style={styles.inputShell}><Ionicons name=\"lock-closed-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={pin} onChangeText={setPin} placeholder=\"اختر رقمًا سريًا من 4 إلى 8 أرقام\" keyboardType=\"number-pad\" secureTextEntry textAlign=\"right\" editable={!otpSent} /></View>\n        {otpSent ? <>"
          if "أوافق على الشروط والأحكام وسياسة الخصوصية" not in s:
              assert marker in s
              acceptance = """        <View style={styles.inputShell}><Ionicons name=\"lock-closed-outline\" size={20} color={MUTED} /><TextInput style={styles.inputInner} value={pin} onChangeText={setPin} placeholder=\"اختر رقمًا سريًا من 4 إلى 8 أرقام\" keyboardType=\"number-pad\" secureTextEntry textAlign=\"right\" editable={!otpSent} /></View>\n        <Pressable onPress={() => !otpSent && setTermsAccepted((x) => !x)} disabled={otpSent} style={{ minHeight:48, borderRadius:13, borderWidth:1, borderColor:termsAccepted?PURPLE:'#D8D2DF', backgroundColor:termsAccepted?PURPLE_LIGHT:'#fff', paddingHorizontal:12, flexDirection:'row-reverse', alignItems:'center', gap:9, marginBottom:7 }}>\n          <Ionicons name={termsAccepted ? 'checkbox' : 'square-outline'} size={23} color={PURPLE} />\n          <Text style={{ flex:1, textAlign:'right', color:TEXT, fontSize:12, fontWeight:'800' }}>أوافق على الشروط والأحكام وسياسة الخصوصية</Text>\n        </Pressable>\n        <View style={{ flexDirection:'row-reverse', justifyContent:'center', gap:18, marginBottom:10 }}>\n          <Pressable onPress={() => void Linking.openURL(`${SITE_URL}/terms`)}><Text style={{ color:PURPLE, fontSize:11, fontWeight:'900', textDecorationLine:'underline' }}>الشروط والأحكام</Text></Pressable>\n          <Pressable onPress={() => void Linking.openURL(`${SITE_URL}/privacy`)}><Text style={{ color:PURPLE, fontSize:11, fontWeight:'900', textDecorationLine:'underline' }}>سياسة الخصوصية</Text></Pressable>\n        </View>\n        {otpSent ? <>"""
              s = s.replace(marker, acceptance, 1)

          logout_block = """  const logout = () => {\n    SecureStore.deleteItemAsync('used_auth_token').catch(() => undefined);\n    setToken('');\n    setUser(null);\n    setMine([]);\n    setDetail(null);\n    setEditListing(null);\n    setEditReturnDetailId(null);\n    setActiveConversation(null);\n    setUnreadMessages(0);\n    unreadBaseline.current = null;\n    setScreen('home');\n  };\n"""
          if "const deleteAccount = () =>" not in s:
              assert logout_block in s
              delete_block = """\n  const deleteAccount = () => {\n    Alert.alert('حذف الحساب نهائيًا', 'سيتم حذف حسابك وإعلاناتك وصورك وفيديوهاتك ورسائلك المرتبطة بالحساب. لا يمكن التراجع عن هذه العملية. هل أنت متأكد؟', [\n      { text: 'إلغاء', style: 'cancel' },\n      { text: 'حذف الحساب', style: 'destructive', onPress: async () => {\n        try {\n          await request('/account', { method: 'DELETE' }, token);\n          logout();\n          Alert.alert('تم حذف الحساب', 'تم حذف حسابك والبيانات المرتبطة به بنجاح.');\n        } catch (e) {\n          Alert.alert('تعذر حذف الحساب', e instanceof Error ? e.message : 'حدث خطأ غير متوقع.');\n        }\n      } },\n    ]);\n  };\n"""
              s = s.replace(logout_block, logout_block + delete_block, 1)

          account_old = """      <Pressable style={styles.menuAction} onPress={() => setScreen('mine')}><Ionicons name=\"albums-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>إعلاناتي</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.dangerButton} onPress={logout}><Ionicons name=\"log-out-outline\" size={20} color=\"#DC2626\" /><Text style={styles.dangerText}>تسجيل الخروج</Text></Pressable>"""
          account_new = """      <Pressable style={styles.menuAction} onPress={() => setScreen('mine')}><Ionicons name=\"albums-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>إعلاناتي</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.menuAction} onPress={() => setScreen('privacy')}><Ionicons name=\"shield-checkmark-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>سياسة الخصوصية</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.menuAction} onPress={() => setScreen('terms')}><Ionicons name=\"document-text-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>الشروط والأحكام</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.dangerButton} onPress={deleteAccount}><Ionicons name=\"trash-outline\" size={20} color=\"#DC2626\" /><Text style={styles.dangerText}>حذف الحساب نهائيًا</Text></Pressable>\n      <Pressable style={[styles.dangerButton, { borderColor:'#D8D2DF', backgroundColor:'#fff' }]} onPress={logout}><Ionicons name=\"log-out-outline\" size={20} color={MUTED} /><Text style={[styles.dangerText, { color:MUTED }]}>تسجيل الخروج</Text></Pressable>"""
          if account_new not in s:
              assert account_old in s
              s = s.replace(account_old, account_new, 1)

          admin_marker = "  if (screen === 'admin') content = token && user?.role === 'admin' ? <AdminPanel token={token} /> : <LoginPanel onLogin={loggedIn} />;"
          legal_content = "  if (screen === 'privacy') content = <LegalScreen type=\"privacy\" />;\n  if (screen === 'terms') content = <LegalScreen type=\"terms\" />;\n"
          if legal_content not in s:
              assert admin_marker in s
              s = s.replace(admin_marker, legal_content + admin_marker, 1)

          title_old = ": screen === 'admin' ? 'لوحة الإدارة' : 'حسابي'}</Text>"
          title_new = ": screen === 'privacy' ? 'سياسة الخصوصية' : screen === 'terms' ? 'الشروط والأحكام' : screen === 'admin' ? 'لوحة الإدارة' : 'حسابي'}</Text>"
          if title_new not in s:
              assert title_old in s
              s = s.replace(title_old, title_new, 1)

          menu_old = """              ['favorites', 'heart-outline', 'المفضلة'],\n            ] as [Screen, any, string][]).map"""
          menu_new = """              ['favorites', 'heart-outline', 'المفضلة'],\n              ['privacy', 'shield-checkmark-outline', 'سياسة الخصوصية'],\n              ['terms', 'document-text-outline', 'الشروط والأحكام'],\n            ] as [Screen, any, string][]).map"""
          if menu_new not in s:
              assert menu_old in s
              s = s.replace(menu_old, menu_new, 1)

          p.write_text(s)

          p = Path('api/app/Http/Controllers/Api/AuthController.php')
          s = p.read_text()
          if "use Illuminate\\Support\\Facades\\Storage;" not in s:
              marker = "use Illuminate\\Support\\Facades\\Hash;\n"
              assert marker in s
              s = s.replace(marker, marker + "use Illuminate\\Support\\Facades\\Storage;\n", 1)

          auth_marker = "    public function me(Request $request) { return $request->user(); }\n    public function logout(Request $request) { $request->user()->currentAccessToken()?->delete(); return response()->noContent(); }"
          if "public function destroyAccount" not in s:
              assert auth_marker in s
              auth_new = """    public function me(Request $request) { return $request->user(); }\n\n    public function destroyAccount(Request $request)\n    {\n        $user = $request->user();\n        abort_if($user->role === 'admin', 403, 'لا يمكن حذف حساب الإدارة من التطبيق.');\n\n        $user->load(['listings.images']);\n        $paths = [];\n        foreach ($user->listings as $listing) {\n            foreach ($listing->images as $image) {\n                if ($image->path) $paths[] = $image->path;\n                if ($image->processed_path) $paths[] = $image->processed_path;\n            }\n            if ($listing->video_path) $paths[] = $listing->video_path;\n        }\n\n        DB::transaction(function () use ($user) {\n            OtpCode::where('phone', $user->phone)->delete();\n            $user->tokens()->delete();\n            $user->delete();\n        });\n\n        foreach (array_unique(array_filter($paths)) as $path) {\n            Storage::disk('public')->delete($path);\n        }\n\n        return response()->noContent();\n    }\n\n    public function logout(Request $request) { $request->user()->currentAccessToken()?->delete(); return response()->noContent(); }"""
              s = s.replace(auth_marker, auth_new, 1)
          p.write_text(s)

          p = Path('api/routes/api.php')
          s = p.read_text()
          route_old = "    Route::get('/me',[AuthController::class,'me']); Route::post('/logout',[AuthController::class,'logout']);"
          route_new = "    Route::get('/me',[AuthController::class,'me']); Route::post('/logout',[AuthController::class,'logout']); Route::delete('/account',[AuthController::class,'destroyAccount']);"
          if route_new not in s:
              assert route_old in s
              s = s.replace(route_old, route_new, 1)
          p.write_text(s)

          p = Path('api/routes/web.php')
          s = p.read_text()
          if "Route::get('/privacy'" not in s:
              s += "\n\nRoute::get('/privacy', fn () => response()->file(public_path('privacy.html')));\nRoute::get('/terms', fn () => response()->file(public_path('terms.html')));\nRoute::get('/delete-account', fn () => response()->file(public_path('delete-account.html')));\n"
          p.write_text(s)
          PY

      - name: Validate PHP and TypeScript
        run: |
          php -l api/app/Http/Controllers/Api/AuthController.php
          php -l api/routes/api.php
          php -l api/routes/web.php
          cd mobile
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Verify compliance wiring
        run: |
          grep -q "LegalScreen type=\"privacy\"" mobile/App.tsx
          grep -q "أوافق على الشروط والأحكام وسياسة الخصوصية" mobile/App.tsx
          grep -q "حذف الحساب نهائيًا" mobile/App.tsx
          grep -q "Route::delete('/account'" api/routes/api.php
          grep -q "Route::get('/privacy'" api/routes/web.php

      - name: Commit app and API changes
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add mobile/App.tsx api/app/Http/Controllers/Api/AuthController.php api/routes/api.php api/routes/web.php
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add legal screens consent and account deletion'
          git push origin main
