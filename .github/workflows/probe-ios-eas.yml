name: Check iOS EAS Readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ios-eas.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Expo authentication and project link
        working-directory: mobile
        run: |
          set +e
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EAS_STATUS=EXPO_TOKEN_MISSING"
            exit 0
          fi
          echo "EAS_STATUS=EXPO_TOKEN_PRESENT"
          npx --yes eas-cli@latest whoami
          WHOAMI_RC=$?
          echo "EAS_WHOAMI_RC=$WHOAMI_RC"
          npx --yes eas-cli@latest project:info --non-interactive
          PROJECT_RC=$?
          echo "EAS_PROJECT_INFO_RC=$PROJECT_RC"
          exit 0
