name: Verify Used Account

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-used-account.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_verify_key
          chmod 600 ~/.ssh/used_verify_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Check account formats
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_verify_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -s" <<'REMOTE'
          set -eu
          cd '${{ secrets.DEPLOY_PATH }}/api'
          php artisan tinker --execute="
          \$local = Illuminate\\Support\\Facades\\DB::table('users')->where('phone','0500007650')->first();
          \$intl = Illuminate\\Support\\Facades\\DB::table('users')->where('phone','966500007650')->first();
          echo 'LOCAL_EXISTS='.(\$local ? 'YES' : 'NO').PHP_EOL;
          echo 'INTL_EXISTS='.(\$intl ? 'YES' : 'NO').PHP_EOL;
          \$u = \$intl ?: \$local;
          echo 'PIN_SET='.(\$u && !empty(\$u->pin) ? 'YES' : 'NO').PHP_EOL;
          echo 'PASSWORD_SET='.(\$u && !empty(\$u->password) ? 'YES' : 'NO').PHP_EOL;
          "
          REMOTE
