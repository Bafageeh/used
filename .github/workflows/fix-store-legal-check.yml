name: Fix Store Legal Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-store-legal-check.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dependency check and retrigger legal workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-store-legal-compliance.yml')
          s = p.read_text()
          old = """      - name: TypeScript check
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
"""
          new = """      - name: TypeScript check
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install
          npx tsc --noEmit
"""
          if old not in s:
              raise SystemExit('TypeScript check block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-store-legal-compliance.yml
          git commit -m "fix: use fresh dependencies for legal compliance check"
          git push origin main
