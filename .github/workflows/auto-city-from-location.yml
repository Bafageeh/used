name: Apply Automatic City From Location

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-city-from-location.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill city automatically from selected location
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('mobile/App.tsx')
          s = p.read_text()

          anchor = "type Coordinates = { latitude: number; longitude: number };\n"
          helper = '''type Coordinates = { latitude: number; longitude: number };\n\nasync function cityFromCoordinates(coords: Coordinates): Promise<string> {\n  try {\n    const places = await Location.reverseGeocodeAsync(coords);\n    const place = places?.[0];\n    if (!place) return '';\n    return String(place.city || place.subregion || place.district || place.region || '').trim();\n  } catch {\n    return '';\n  }\n}\n'''
          assert anchor in s, 'coordinates anchor not found'
          s = s.replace(anchor, helper, 1)

          old_create = '''      const current = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.Balanced });\n      setCoords({ latitude: current.coords.latitude, longitude: current.coords.longitude });\n      Alert.alert('تم تحديد الموقع', 'سيُحفظ الموقع الدقيق مع الإعلان لاستخدام ميزة القريب.');'''
          new_create = '''      const current = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.Balanced });\n      const nextCoords = { latitude: current.coords.latitude, longitude: current.coords.longitude };\n      setCoords(nextCoords);\n      const detectedCity = await cityFromCoordinates(nextCoords);\n      if (detectedCity) {\n        setCity(detectedCity);\n        Alert.alert('تم تحديد الموقع', `تم تحديد المدينة تلقائيًا: ${detectedCity}`);\n      } else {\n        Alert.alert('تم تحديد الموقع', 'تم حفظ الموقع الدقيق، لكن تعذر معرفة اسم المدينة تلقائيًا. يمكنك كتابتها يدويًا.');\n      }'''
          assert old_create in s, 'create location block not found'
          s = s.replace(old_create, new_create, 1)

          old_edit = '''      const current = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.Balanced });\n      setCoords({ latitude: current.coords.latitude, longitude: current.coords.longitude });'''
          new_edit = '''      const current = await Location.getCurrentPositionAsync({ accuracy: Location.Accuracy.Balanced });\n      const nextCoords = { latitude: current.coords.latitude, longitude: current.coords.longitude };\n      setCoords(nextCoords);\n      const detectedCity = await cityFromCoordinates(nextCoords);\n      if (detectedCity) setCity(detectedCity);\n      else Alert.alert('الموقع', 'تم حفظ الموقع الدقيق، لكن تعذر معرفة اسم المدينة تلقائيًا. يمكنك كتابتها يدويًا.');'''
          assert old_edit in s, 'edit location block not found'
          s = s.replace(old_edit, new_edit, 1)

          old_input = '<TextInput style={styles.input} value={city} onChangeText={setCity} placeholder="المدينة" textAlign="right" />'
          new_input = '<TextInput style={styles.input} value={city} onChangeText={setCity} placeholder="المدينة — تُحدد تلقائيًا من الموقع" textAlign="right" />'
          count = s.count(old_input)
          assert count >= 1, f'city input not found: {count}'
          s = s.replace(old_input, new_input)

          old_button = "{locating ? 'جاري تحديد الموقع...' : coords ? 'تم حفظ الموقع الدقيق' : 'استخدام موقعي الحالي'}"
          new_button = "{locating ? 'جاري تحديد الموقع والمدينة...' : coords ? (city ? `تم حفظ الموقع • ${city}` : 'تم حفظ الموقع الدقيق') : 'استخدام موقعي الحالي'}"
          count = s.count(old_button)
          assert count >= 1, f'location button label not found: {count}'
          s = s.replace(old_button, new_button)

          p.write_text(s)
          PY

      - name: TypeScript check
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "feat: fill listing city from selected location"
          git push origin main
