name: Tanazul iOS Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/ios-build-trigger.txt"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Build and submit iOS production to TestFlight
        working-directory: mobile
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info --non-interactive
          npx --yes eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive --no-wait

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check EAS build and submission status
        run: |
          set +e
          echo '=== BUILD STATUS ==='
          npx --yes eas-cli@latest build:view bd3c67d7-dac9-4078-8e27-125b69c59730 --json
          echo '=== SUBMISSION STATUS ==='
          npx --yes eas-cli@latest submit:list --platform ios --limit 5 --json
          exit 0
