name: Build Tanazul iOS Production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Trigger iOS production build
        working-directory: mobile
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info --non-interactive
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --no-wait
