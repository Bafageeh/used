name: Remove Background Removal UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-background-removal-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove background-removal text from mobile listing form
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          text = p.read_text()
          old = "        <Text style={{ color: MUTED, fontSize: 11, textAlign: 'right', marginTop: 5 }}>تُزال خلفية الصور تلقائيًا مع الاحتفاظ بالصورة الأصلية.</Text>\n"
          text = text.replace(old, '')
          p.write_text(text)
          PY

      - name: Commit mobile UI cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove automatic background removal notice"
          git push origin HEAD:main
