name: Align Used Mobile to Expo SDK 54

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/downgrade-used-sdk54.yml"
      - "mobile/package.json"

permissions:
  contents: write

jobs:
  align-sdk54:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Build clean Expo SDK 54 dependency set
        working-directory: mobile
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npx expo-doctor@latest

      - name: Commit clean SDK 54 lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Generate clean Expo SDK 54 dependencies for Used"
            git push origin HEAD:main
          fi
