name: Dispatch Used Expo Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-used-expo-now.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build Used APK locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching local APK build with approved app icon"
          gh workflow run build-apk-local.yml --repo Bafageeh/used --ref main
