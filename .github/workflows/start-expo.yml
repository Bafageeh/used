name: Start Used Expo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/start-expo.yml"

concurrency:
  group: used-expo-test
  cancel-in-progress: true

jobs:
  start-expo:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_expo_key
          chmod 600 ~/.ssh/used_expo_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload mobile app
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tar --exclude=node_modules --exclude=.expo -C mobile -czf /tmp/used-mobile.tgz .
          scp -i ~/.ssh/used_expo_key -P "$SERVER_PORT" /tmp/used-mobile.tgz "$SERVER_USER@$SERVER_HOST:/tmp/used-mobile.tgz"
          ssh -i ~/.ssh/used_expo_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            MOBILE_PATH=\$(dirname '$DEPLOY_PATH')/mobile
            mkdir -p \"\$MOBILE_PATH\"
            tar -C \"\$MOBILE_PATH\" -xzf /tmp/used-mobile.tgz
            rm -f /tmp/used-mobile.tgz
            cd \"\$MOBILE_PATH\"
            if [ -f package-lock.json ]; then npm ci; else npm install; fi"

      - name: Start Expo in background
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_expo_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "set -e
            MOBILE_PATH=\$(dirname '$DEPLOY_PATH')/mobile
            cd \"\$MOBILE_PATH\"
            if [ -f expo.pid ]; then
              OLD_PID=\$(cat expo.pid 2>/dev/null || true)
              if [ -n \"\$OLD_PID\" ]; then kill \"\$OLD_PID\" 2>/dev/null || true; fi
            fi
            if command -v fuser >/dev/null 2>&1; then fuser -k 8091/tcp 2>/dev/null || true; fi
            rm -f expo.log expo.pid
            nohup npx expo start --clear --go --tunnel --port 8091 > \"\$MOBILE_PATH/expo.log\" 2>&1 < /dev/null &
            NEW_PID=\$!
            echo \"\$NEW_PID\" > \"\$MOBILE_PATH/expo.pid\"
            echo \"Started Expo PID \$NEW_PID\"
          "
          sleep 45

      - name: Verify Expo and print test URL
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/used_expo_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "
            MOBILE_PATH=\$(dirname '$DEPLOY_PATH')/mobile
            cd \"\$MOBILE_PATH\"
            echo '--- EXPO PROCESS ---'
            if [ -f expo.pid ] && kill -0 \$(cat expo.pid) 2>/dev/null; then echo RUNNING; else echo NOT_RUNNING; fi
            echo '--- EXPO URL ---'
            grep -Eo 'https://[A-Za-z0-9.-]+\.exp\.direct' expo.log | tail -n 1 || true
            echo '--- LAST LOG LINES ---'
            tail -n 100 expo.log || true
          "
