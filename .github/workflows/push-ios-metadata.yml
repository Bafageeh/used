name: Push Tanazul App Store Metadata

on:
  workflow_dispatch:

jobs:
  push_metadata:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate App Store metadata
        working-directory: mobile
        run: npx --yes eas-cli@latest metadata:lint --profile production
      - name: Push App Store metadata
        working-directory: mobile
        run: npx --yes eas-cli@latest metadata:push --profile production --non-interactive
