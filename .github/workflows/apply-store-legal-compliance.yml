          <section class="card"><h2>1. قبول الشروط</h2><p>باستخدام «مستعمل مجاني» أو إنشاء حساب أو نشر إعلان، فإنك توافق على هذه الشروط وسياسة الخصوصية. إذا لم توافق فلا تستخدم الميزات التي تتطلب حسابًا أو نشر محتوى.</p></section>
          <section class="card"><h2>2. طبيعة الخدمة</h2><p>«مستعمل مجاني» منصة إعلانات مجانية. التطبيق ليس بائعًا أو مشتريًا أو وسيط دفع أو ضامنًا لأي صفقة، ولا يستلم قيمة السلع نيابةً عن المستخدمين.</p></section>
          <section class="card"><h2>3. الحساب وأمنه</h2><ul><li>يجب تقديم بيانات صحيحة والمحافظة على سرية الرقم السري.</li><li>أنت مسؤول عن النشاط الصادر من حسابك ما لم تبلغنا عن استخدام غير مصرح به.</li><li>يجوز تعليق أو حذف الحسابات المستخدمة في الاحتيال أو الإساءة أو مخالفة هذه الشروط أو الأنظمة.</li></ul></section>
          <section class="card"><h2>4. قواعد الإعلانات والمحتوى</h2><ul><li>يجب أن يكون الإعلان صحيحًا وأن تكون لك صلاحية نظامية لعرض السلعة.</li><li>يُمنع المحتوى غير القانوني أو الاحتيالي أو المضلل، والسلع المسروقة أو المقلدة، والأسلحة والمتفجرات والمواد الخطرة أو المخدرات والمواد المحظورة، والمحتوى الجنسي أو الاستغلالي، والكراهية أو التهديد أو التحرش، وانتهاك الخصوصية أو الملكية الفكرية، والرسائل المزعجة أو الروابط الضارة.</li><li>يُمنع نشر بيانات شخصية للآخرين دون حق أو موافقة أو استخدام التطبيق لانتحال الهوية أو الإضرار بالغير.</li><li>يجوز حذف أو إخفاء أي إعلان أو رسالة أو حساب مخالف.</li></ul></section>
          <section class="card"><h2>5. المحتوى الذي تنشره</h2><p>تظل مالكًا للمحتوى الذي ترفعه، وتمنح المنصة ترخيصًا غير حصري ومحدودًا بقدر ما يلزم لاستضافته ومعالجته وعرضه وتشغيل ميزات التطبيق.</p></section>
          <section class="card"><h2>6. التواصل والصفقات</h2><ul><li>الاتفاق والاستلام والفحص مسؤولية المستخدمين.</li><li>تحقق من السلعة والطرف الآخر ولا ترسل أموالًا أو معلومات حساسة استجابةً لروابط أو رسائل غير موثوقة.</li><li>لا نضمن صحة كل إعلان أو هوية كل مستخدم، مع اتخاذ إجراءات معقولة للحد من الإساءة عند اكتشافها أو الإبلاغ عنها.</li></ul></section>
          <section class="card"><h2>7. الموقع ورقم الجوال</h2><p>إضافة الموقع الدقيق وإظهار رقم الجوال ميزتان اختياريتان، ويتحمل المستخدم مسؤولية المعلومات التي يقرر نشرها.</p></section>
          <section class="card"><h2>8. الإبلاغ والإدارة</h2><p>يمكن الإبلاغ عن المحتوى أو السلوك المخالف عبر <a href="mailto:a.baf@live.com">a.baf@live.com</a>. يحق للإدارة التحقيق وإزالة المحتوى أو تقييد الحسابات، ولا يمنع ذلك من اللجوء إلى الجهات المختصة عند وجود احتيال أو تهديد أو مخالفة.</p></section>
          <section class="card"><h2>9. إخلاء المسؤولية</h2><p>تُقدم الخدمة كما هي ضمن الحدود المسموح بها نظامًا. لا نضمن إتمام صفقة أو جودة سلعة أو استمرار الخدمة دون انقطاع، ولا نستبعد أي مسؤولية لا يجوز استبعادها نظامًا.</p></section>
          <section class="card"><h2>10. إنهاء الاستخدام وحذف الحساب</h2><p>يمكن للمستخدم حذف حسابه من داخل التطبيق. ويجوز تعليق أو إنهاء الحساب عند المخالفات الجسيمة أو المتكررة مع مراعاة الأنظمة.</p></section>
