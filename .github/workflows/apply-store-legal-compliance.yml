          marker = "      <Pressable style={styles.menuAction} onPress={() => setScreen('mine')}><Ionicons name=\"albums-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>إعلاناتي</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.dangerButton} onPress={logout}><Ionicons name=\"log-out-outline\" size={20} color=\"#DC2626\" /><Text style={styles.dangerText}>تسجيل الخروج</Text></Pressable>"
          assert marker in s
          repl = """      <Pressable style={styles.menuAction} onPress={() => setScreen('mine')}><Ionicons name=\"albums-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>إعلاناتي</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.menuAction} onPress={() => setScreen('privacy')}><Ionicons name=\"shield-checkmark-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>سياسة الخصوصية</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.menuAction} onPress={() => setScreen('terms')}><Ionicons name=\"document-text-outline\" size={22} color={PURPLE} /><Text style={styles.menuActionText}>الشروط والأحكام</Text><Ionicons name=\"chevron-back\" size={20} color=\"#A1A1AA\" /></Pressable>\n      <Pressable style={styles.dangerButton} onPress={deleteAccount}><Ionicons name=\"trash-outline\" size={20} color=\"#DC2626\" /><Text style={styles.dangerText}>حذف الحساب نهائيًا</Text></Pressable>\n      <Pressable style={[styles.dangerButton, { borderColor:'#D8D2DF', backgroundColor:'#fff' }]} onPress={logout}><Ionicons name=\"log-out-outline\" size={20} color={MUTED} /><Text style={[styles.dangerText, { color:MUTED }]}>تسجيل الخروج</Text></Pressable>"""
          s = s.replace(marker, repl, 1)

          marker = "  if (screen === 'admin') content = token && user?.role === 'admin' ? <AdminPanel token={token} /> : <LoginPanel onLogin={loggedIn} />;"
          assert marker in s
          s = s.replace(marker, "  if (screen === 'privacy') content = <LegalScreen type=\"privacy\" />;\n  if (screen === 'terms') content = <LegalScreen type=\"terms\" />;\n" + marker, 1)

          old = ": screen === 'admin' ? 'لوحة الإدارة' : 'حسابي'}</Text>"
          new = ": screen === 'privacy' ? 'سياسة الخصوصية' : screen === 'terms' ? 'الشروط والأحكام' : screen === 'admin' ? 'لوحة الإدارة' : 'حسابي'}</Text>"
          assert old in s
          s = s.replace(old, new, 1)

          marker = "              ['favorites', 'heart-outline', 'المفضلة'],\n            ] as [Screen, any, string][]).map"
          assert marker in s
          s = s.replace(marker, "              ['favorites', 'heart-outline', 'المفضلة'],\n              ['privacy', 'shield-checkmark-outline', 'سياسة الخصوصية'],\n              ['terms', 'document-text-outline', 'الشروط والأحكام'],\n            ] as [Screen, any, string][]).map", 1)

          p.write_text(s)

          # API: authenticated full account deletion.
          p = Path('api/app/Http/Controllers/Api/AuthController.php')
          s = p.read_text()
          marker = "use Illuminate\\Support\\Facades\\Hash;\n"
          assert marker in s
          s = s.replace(marker, marker + "use Illuminate\\Support\\Facades\\Storage;\n", 1)

          marker = "    public function me(Request $request) { return $request->user(); }\n    public function logout(Request $request) { $request->user()->currentAccessToken()?->delete(); return response()->noContent(); }"
          assert marker in s
          replacement = """    public function me(Request $request) { return $request->user(); }\n\n    public function destroyAccount(Request $request)\n    {\n        $user = $request->user();\n        abort_if($user->role === 'admin', 403, 'لا يمكن حذف حساب الإدارة من التطبيق.');\n\n        $user->load(['listings.images']);\n        $paths = [];\n        foreach ($user->listings as $listing) {\n            foreach ($listing->images as $image) {\n                if ($image->path) $paths[] = $image->path;\n                if ($image->processed_path) $paths[] = $image->processed_path;\n            }\n            if ($listing->video_path) $paths[] = $listing->video_path;\n        }\n\n        DB::transaction(function () use ($user) {\n            OtpCode::where('phone', $user->phone)->delete();\n            $user->tokens()->delete();\n            $user->delete();\n        });\n\n        foreach (array_unique(array_filter($paths)) as $path) {\n            Storage::disk('public')->delete($path);\n        }\n\n        return response()->noContent();\n    }\n\n    public function logout(Request $request) { $request->user()->currentAccessToken()?->delete(); return response()->noContent(); }"""
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('api/routes/api.php')
          s = p.read_text()
          marker = "    Route::get('/me',[AuthController::class,'me']); Route::post('/logout',[AuthController::class,'logout']);"
          assert marker in s
          s = s.replace(marker, "    Route::get('/me',[AuthController::class,'me']); Route::post('/logout',[AuthController::class,'logout']); Route::delete('/account',[AuthController::class,'destroyAccount']);", 1)
          p.write_text(s)

          p = Path('api/routes/web.php')
          s = p.read_text()
          append = """\n\nRoute::get('/privacy', fn () => response()->file(public_path('privacy.html')));\nRoute::get('/terms', fn () => response()->file(public_path('terms.html')));\nRoute::get('/delete-account', fn () => response()->file(public_path('delete-account.html')));\n"""
          if "Route::get('/privacy'" not in s:
              s += append
          p.write_text(s)
          PY

      - name: Verify source changes
        run: |
          set -e
          grep -q "type Screen = .*'privacy'.*'terms'" mobile/App.tsx
          grep -q "LegalScreen type=\"privacy\"" mobile/App.tsx
          grep -q "حذف الحساب نهائيًا" mobile/App.tsx
          grep -q "Route::delete('/account'" api/routes/api.php
          grep -q "Route::get('/privacy'" api/routes/web.php
          grep -q "سياسة الخصوصية" api/public/privacy.html
          grep -q "الشروط والأحكام" api/public/terms.html
          grep -q "حذف حساب مستعمل مجاني" api/public/delete-account.html
          php -l api/app/Http/Controllers/Api/AuthController.php
          php -l api/routes/api.php
          php -l api/routes/web.php

      - name: TypeScript check
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx mobile/LegalScreen.tsx api/app/Http/Controllers/Api/AuthController.php api/routes/api.php api/routes/web.php api/public/privacy.html api/public/terms.html api/public/delete-account.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add store legal privacy and account deletion compliance"
          git push origin main
