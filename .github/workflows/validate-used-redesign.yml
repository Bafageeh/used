name: Validate Used Redesign

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-used-redesign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Apply compact listing detail layout
        run: python3 .github/scripts/compact_listing_detail.py

      - name: Install dependencies
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: mobile
        run: npx expo install --check

      - name: Bundle Android JavaScript
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/used-dist

      - name: Commit mobile changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.tsx
          git commit -m 'Compact listing detail summary' || exit 0
          git push origin main
