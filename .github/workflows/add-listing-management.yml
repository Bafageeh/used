name: Add Listing Management

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-listing-management.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Patch listing management UI
        run: python3 scripts/patch_listing_management.py

      - name: Validate active app
        working-directory: mobile
        run: |
          npm install
          npx tsc --noEmit
          npx expo install --check
          rm -rf /tmp/used-management-bundle
          npx expo export --platform android --output-dir /tmp/used-management-bundle

      - name: Commit listing management
        run: |
          git restore mobile/package.json mobile/package-lock.json 2>/dev/null || true
          if git diff --quiet -- mobile/App.tsx; then
            echo 'No listing management changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mobile/App.tsx
            git commit -m 'Add edit refresh and delete listing management'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Deploy API and restart Expo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/start-expo.yml/dispatches \
            -d '{"ref":"main"}'
