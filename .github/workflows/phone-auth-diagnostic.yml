name: Phone Auth Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phone-auth-diagnostic.yml"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "PHONE_AUTH_DIAGNOSTIC_OK" --body "Workflow executed successfully for commit $GITHUB_SHA" || true
