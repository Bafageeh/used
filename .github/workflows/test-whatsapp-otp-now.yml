name: Test WhatsApp OTP Now

on:
  push:
    paths:
      - ".github/workflows/test-whatsapp-otp-now.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/used_api_key
          chmod 600 ~/.ssh/used_api_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Send OTP to latest registration attempt
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          ssh -i ~/.ssh/used_api_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "grep -q \"sub_type' => 'url'\" '$DEPLOY_PATH/api/app/Services/WhatsAppOtpService.php'"
          echo 'FIXED_TEMPLATE_PAYLOAD=READY'

          PHONE=$(ssh -i ~/.ssh/used_api_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH/api' && php artisan tinker --execute=\"echo optional(App\\Models\\OtpCode::where('purpose','register')->latest()->first())->phone;\" 2>/dev/null" | tail -n 1 | tr -d '\r\n ')
          test -n "$PHONE"
          printf '%s' "$PHONE" | grep -Eq '^9665[0-9]{8}$'

          EXISTS=$(ssh -i ~/.ssh/used_api_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH/api' && php artisan tinker --execute=\"echo App\\Models\\User::where('phone','${PHONE}')->exists() ? '1' : '0';\" 2>/dev/null" | tail -n 1 | tr -d '\r\n ')
          if [ "$EXISTS" = "1" ]; then
            echo 'LATEST_PHONE_ALREADY_REGISTERED=YES'
            exit 0
          fi

          ssh -i ~/.ssh/used_api_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH/api' && php artisan tinker --execute=\"App\\Models\\OtpCode::where('phone','${PHONE}')->whereNull('verified_at')->delete();\" >/dev/null 2>&1"

          STATUS=$(curl -sS -o /tmp/otp-response.json -w '%{http_code}' -X POST 'https://used.pm.sa/api/auth/request-otp' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "{\"phone\":\"${PHONE}\",\"purpose\":\"register\"}")
          cat /tmp/otp-response.json
          echo
          echo "HTTP_STATUS=$STATUS"
          test "$STATUS" = "200"
          grep -q 'تم إرسال رمز التحقق عبر واتساب' /tmp/otp-response.json
          echo 'WHATSAPP_OTP_END_TO_END=SUCCESS'
